# The *IT suite: a real PostgreSQL and a real Redis in containers, started by the configurations
# in `common`'s test-jar. Flyway runs for real here, which is what makes V1 and V2 part of what the
# suite proves rather than something only production sees.

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.pool-name=CatalogItPool
spring.jpa.show-sql=false

# The whole point of this profile. `spring.cache.type=none` in the fast suite makes @Cacheable a
# no-op; here it is a REAL Redis, because caching behaviour is a claim about a real cache - that a
# second read skips the database, that an update evicts, that a BigDecimal survives the JSON round
# trip - and none of it can be proven against a HashMap.
spring.cache.type=redis
logging.level.com.ecomdemo.cache=DEBUG

# Flyway runs, unlike the fast suite. ddl-auto stays `validate` so a drift between the entities and
# the migrations fails here rather than in production.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# A known signing key, so a test can mint the service token this service demands on every path.
ecomdemo.jwt.secret=integration-test-signing-key-32-chars-minimum
ecomdemo.jwt.issuer=ecomdemo
ecomdemo.jwt.expiry=15m

# No broker in the IT suite by default; the listener is started only by the tests that need one.
spring.kafka.listener.auto-startup=false
spring.kafka.listener.concurrency=1
spring.kafka.consumer.properties.max.poll.interval.ms=10000

# Phase 28: most of these tests run without a broker. The outbox relay would try to publish every
# product change to it (an hour means it never ticks), and KafkaAdmin would try to create the topics
# at startup. The end-to-end test that has a broker turns both back on.
ecomdemo.outbox.poll-delay=1h
spring.kafka.admin.auto-create=false
