# The fast suite: H2, no Flyway, no broker.
spring.datasource.url=jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Phase 17's trap, inherited: without this, KafkaAdmin applies its topic beans at startup and every
# @SpringBootTest spends forty-five seconds timing out against a broker that is not there.
spring.kafka.admin.auto-create=false
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:1
spring.kafka.producer.properties.max.block.ms=1000

ecomdemo.jwt.secret=test-secret-that-is-at-least-32-characters-long

# --- Caching -----------------------------------------------------------------
# OFF for the fast suite, carried over verbatim from the application's test profile along with the
# `cache` module itself. @Cacheable becomes a no-op, so these tests need no Redis and no Docker.
#
# That is not a gap being papered over. Caching behaviour is a claim about a REAL cache: that a
# second read skips the database, that an update evicts, that a BigDecimal survives the round trip
# through JSON. None of it can be proven against a HashMap standing in for Redis. It is proven in
# the *IT suite instead, against a real Redis in a container.
spring.cache.type=none
