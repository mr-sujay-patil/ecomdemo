spring.application.name=catalog-service

# Tracing, sampling and the log format every service shares (Phase 23): see the file itself.
spring.config.import=classpath:ecomdemo-observability.properties

# ---------------------------------------------------------------------------------------------
# Its OWN database, and that is the point of the phase
# ---------------------------------------------------------------------------------------------
# A different host, a different database, a different Flyway history starting at V1. Nothing in
# here can join to `product`, `cart` or `orders`, and that is not a limitation to be worked around
# - it is the boundary. The day somebody needs a join across it, the answer is an API call or an
# event, and the schema is what stops the third option being taken quietly.
spring.datasource.url=jdbc:postgresql://${CATALOG_DB_HOST:localhost}:${CATALOG_DB_PORT:5434}/${CATALOG_DB_NAME:catalog}
spring.datasource.username=${CATALOG_DB_USER:catalog}
spring.datasource.password=${CATALOG_DB_PASSWORD:catalog}

# `validate`, never `update`. Flyway owns the schema; Hibernate's job is to notice when the
# entities and the migrations have drifted apart and to refuse to start rather than to "fix" it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

server.port=${CATALOG_PORT:8081}

# ---------------------------------------------------------------------------------------------
# JWT: this service VALIDATES, it does not issue
# ---------------------------------------------------------------------------------------------
# The same secret as customer-service, because HMAC signing and verification use one key - which
# is also the honest argument FOR asymmetric signing in a real deployment, where five services
# each holding the signing key means five places it can leak. RS256 with a published public key is
# the production answer, and it is recorded in docs/decisions.md rather than pretended away.
#
# What matters for the split is that verification is LOCAL. No service calls customer-service to
# ask whether a token is real; it checks a signature it can check by itself. That is what Phase 9
# bought, and it is why a five-service system does not need an authentication round trip on every
# request.
ecomdemo.jwt.secret=${JWT_SECRET:}
ecomdemo.jwt.issuer=ecomdemo

# ---------------------------------------------------------------------------------------------
# Kafka: CONSUMES stock changes, publishes nothing
# ---------------------------------------------------------------------------------------------
# The mirror image of inventory-service, which publishes and consumes nothing. This service listens
# on `inventory.stock-changed` so it can evict the catalogue caches when a sale moves a number it is
# serving from Redis.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=ecomdemo-catalogue-cache
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# NOTE, and it is the whole lesson of Phase 20b: there is deliberately NO
# `spring.json.value.default.type` here. Setting one is how the stock event came to be deserialised
# as an OrderPlacedEvent in the application - a GLOBAL default inherited by every topic, with the
# failure showing ZERO consumer lag because the records were consumed, failed, retried, exhausted
# and dropped. The listener names its own container factory instead. See StockChangedListenerConfig.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecomdemo.*

# `earliest`, so a service that starts after a sale still hears about it rather than silently
# serving a stale figure until the TTL rescues it.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# ---------------------------------------------------------------------------------------------
# Redis: the catalogue cache, which moved in with the catalogue
# ---------------------------------------------------------------------------------------------
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# ---------------------------------------------------------------------------------------------
# inventory-service, which this service calls for the stock figure on a listing
# ---------------------------------------------------------------------------------------------
ecomdemo.inventory.base-url=${INVENTORY_BASE_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# The tag every metric from this service carries, so one Prometheus can tell the services apart.
# Read by MetricsConfig in `common`, which has no default for it - a service that forgets this line
# fails to start rather than publishing untagged metrics that quietly merge with another service's.
ecomdemo.metrics.application=catalog-service

# ---------------------------------------------------------------------------------------------
# The language model (Phase 27)
# ---------------------------------------------------------------------------------------------
# Both the OpenAI and the Ollama starters are on the classpath, and every Spring AI model
# auto-configuration switches itself ON when its `spring.ai.model.*` key is missing. So every key is
# set: `chat` from AI_CHAT_PROVIDER (openai | ollama | none), `embedding` from AI_EMBEDDING_PROVIDER
# (Phase 28, the same three), and the rest `none`, because this service needs no images, audio or
# moderation. The result: at most one chat model and one embedding model, the chosen ones - or, with
# `none`, no model at all. The two are independent: embeddings can be local while chat is hosted.
spring.ai.model.chat=${AI_CHAT_PROVIDER:none}
spring.ai.model.embedding=${AI_EMBEDDING_PROVIDER:none}
spring.ai.model.embedding.text=none
spring.ai.model.embedding.multimodal=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Temperature: how far the model strays from its most likely next word. 0 is repetitive and
# literal; above 1 it starts inventing. Product copy wants some variety but no invention.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.options.temperature=${AI_TEMPERATURE:0.4}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2}
spring.ai.ollama.chat.options.temperature=${AI_TEMPERATURE:0.4}

# Timeouts and retries. The defaults are built for batch jobs - 60 s per call, and Spring AI's
# retry makes up to 10 attempts with a backoff growing from 2 s by x5 - which would hold an admin's
# HTTP request for many minutes. Here: at most two attempts, each with an AI_TIMEOUT deadline, so an
# admin waits about a minute in the worst case. OpenAI's client takes its own timeout and retry
# count; Ollama's deadline comes from OllamaClientConfig and its retry from spring.ai.retry.
ecomdemo.ai.timeout=${AI_TIMEOUT:30s}
spring.ai.openai.chat.timeout=${ecomdemo.ai.timeout}
spring.ai.openai.chat.max-retries=1
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.openai.embedding.timeout=${ecomdemo.ai.timeout}
spring.ai.openai.embedding.max-retries=1

# ---------------------------------------------------------------------------------------------
# Semantic search (Phase 28)
# ---------------------------------------------------------------------------------------------
# The embedding models. BOTH produce 768 numbers per text, because the column is vector(768) (V4):
# nomic-embed-text does natively; text-embedding-3-small makes 1536 and is asked for 768 - its
# vectors are trained so a shortened one keeps most of the meaning. Changing to a model of another
# size means a new migration and a backfill: vectors from two models cannot be compared.
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.openai.embedding.options.dimensions=768
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# Spring AI's PgVectorStore auto-configuration needs an EmbeddingModel and would stop the service
# from starting under AI_EMBEDDING_PROVIDER=none. ProductSearchIndex builds the store itself, only
# when a model exists.
spring.ai.vectorstore.type=none

# The minimum similarity and the task prefixes belong to the MODEL, so each provider has its own
# (SearchProperties explains). The SEARCH_* variables override the active provider's when set.
#
# Ollama (nomic-embed-text), MEASURED on the seeded catalogue (docs/test-reports/phase-28.md): its
# scores are squeezed between about 0.4 and 0.65 for every query, relevant or not. The prefixes are
# the ones nomic was trained with, and put the right product first more often. 0.5 drops queries
# about nothing in the shop ("a garden hose": best 0.49) and keeps every right answer measured
# (lowest 0.51); it cannot drop all of them ("a sofa": 0.62), which a threshold alone never will.
# OpenAI (text-embedding-3-small): NOT measured here (no key on the machine that built this). 0.3
# is a starting point, lower because its scores are known to run lower; check it with real queries.
ecomdemo.search.provider=${spring.ai.model.embedding}
ecomdemo.search.min-similarity=${SEARCH_MIN_SIMILARITY:}
ecomdemo.search.document-prefix=${SEARCH_DOCUMENT_PREFIX:}
ecomdemo.search.query-prefix=${SEARCH_QUERY_PREFIX:}
ecomdemo.search.models.ollama.min-similarity=0.5
ecomdemo.search.models.ollama.document-prefix=search_document:
ecomdemo.search.models.ollama.query-prefix=search_query:
ecomdemo.search.models.openai.min-similarity=0.3
ecomdemo.search.default-limit=5
ecomdemo.search.max-limit=20

# The embedding sync publishes through the outbox (the Phase 24 library), so this service is now a
# producer as well: the same settings as inventory-service's, for the same reasons (acks=all and
# idempotence for durability; a 5 s metadata wait so a broker outage cannot become a stuck relay).
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=3000

# The backfill is started by its endpoint, never by the application starting (Boot's default
# would run every Job bean at startup, on every pod). Its tables are V4's.
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never

# KI-001: this service publishes its own OpenAPI document at /v3/api-docs, and the gateway serves
# it at /v3/api-docs/<service> in its Swagger UI (http://localhost:8080/swagger-ui.html). The title
# says whose document it is; OpenApiConfig adds the conventions every document shares.
ecomdemo.openapi.title=EcomDemo Catalog API
ecomdemo.openapi.summary=The product catalogue: browse, search (by keyword or by meaning) and, as an ADMIN, maintain it. Browsing needs no account.
