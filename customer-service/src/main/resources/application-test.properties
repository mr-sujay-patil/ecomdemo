# The fast suite: H2, no Flyway, no broker.
spring.datasource.url=jdbc:h2:mem:customer;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# No Kafka settings at all, and the ABSENCE is the point: this service neither publishes nor
# consumes, so there is no broker to stub out and no topic beans to stop from being applied. The
# other services' test profiles carry those lines because they need them.

ecomdemo.jwt.secret=test-secret-that-is-at-least-32-characters-long

# A login has to produce a token in the fast suite too.
ecomdemo.jwt.expiry=15m
