# The *IT suite: a real PostgreSQL in a container, with Flyway ON - so V1 and its seeded
# administrator are part of what the suite proves rather than something only production sees.
#
# That matters more here than in the other services. The seeded admin's ID has to be 1, because
# order-service's `orders.user_id` holds ids issued by this service and Phase 20d removed the foreign
# key that used to tie them together. Nothing enforces that agreement now except a migration and a
# test that reads it.

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.pool-name=CustomerItPool
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# A known signing key, so a test can verify the token a login hands back.
ecomdemo.jwt.secret=integration-test-signing-key-32-chars-minimum
ecomdemo.jwt.issuer=ecomdemo
ecomdemo.jwt.expiry=15m
