# --------------------------------------------------------------------------------------------------------
# Client certificates (Phase 35): how a service proves WHO it is to PostgreSQL and Kafka, and (Phase 36) to
# Redis. One per service that uses any of the three, the same certificate for all of them, so a service has one
# identity everywhere; gateway-service and assistant-service use only Redis. One per database client, separate from the service's server certificate above (`<service>-tls`), because the two answer
# different questions and are read by different code:
#   - commonName is the identity, and it must be the DATABASE USER: with `scram-sha-256 clientcert=verify-full`
#     PostgreSQL requires the CN to equal the login name (a `map=` is not allowed with a password method).
#     Kafka maps the same CN to its principal (`User:catalog`), so one name per service in both places;
#   - `client auth` only: this certificate cannot serve TLS, and the server certificates are not identities;
#   - RSA with a PKCS#8 key: the PostgreSQL JDBC driver reads a PEM key only as unencrypted PKCS#8, and as RSA
#     unless `pemKeyAlgorithm` is set, a camelCase driver property an environment variable cannot carry
#     (Spring Boot lowercases the key). Kafka's PEM support and Spring's SSL bundles read PKCS#8 too.
# Mounted at /etc/ecomdemo-client-tls in the client's pod. Renewed every 60 days like the others; what each
# client does with a renewal is in docs/decisions.md ([Phase 35]).
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-client-tls
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: ecomdemo
spec:
  secretName: app-client-tls
  duration: 2160h
  renewBefore: 720h
  commonName: ecomdemo
  usages:
    - digital signature
    - key encipherment
    - client auth
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS8
    rotationPolicy: Always
  issuerRef:
    name: ecomdemo-ca
    kind: ClusterIssuer
---
