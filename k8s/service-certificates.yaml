# Redis (KI-057). The name every client connects to is `cache`; `localhost` is for `redis-cli` inside the pod.
# Phase 36: Redis requires a client certificate, and the tools in its pod (the readiness probe, the cert-reload
# sidecar, the smoke test's redis-cli) present this one. Without a usage list cert-manager's documented default
# is `digital signature, key encipherment` and no extended key usage, which OpenSSL accepts for any purpose;
# naming both makes the client role a decision rather than a default: Redis refuses a client certificate that
# says `server auth` only ("certificate verify failed", RedisClientAuthIT).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cache-tls
  labels:
    app.kubernetes.io/name: cache
    app.kubernetes.io/part-of: ecomdemo
spec:
  secretName: cache-tls
  duration: 2160h
  renewBefore: 720h
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  dnsNames:
    - cache
    - cache.ecomdemo
    - cache.ecomdemo.svc
    - cache.ecomdemo.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: ecomdemo-ca
    kind: ClusterIssuer
---
