# One TLS certificate per service (KI-056), issued and renewed by cert-manager from the local CA
# (platform/ca.yaml). cert-manager writes tls.crt, tls.key and ca.crt into the Secret `<service>-tls`;
# the Deployment mounts it at /etc/ecomdemo-tls, Spring Boot serves it through an SSL bundle
# (SERVER_SSL_BUNDLE in the ConfigMap) and reloads it when cert-manager renews it, and the `trust-ca`
# init container adds ca.crt to the JVM truststore so the service trusts the others.
#
# The names are what a caller puts in its URL: the Service name inside the namespace, its longer forms,
# and `localhost` / 127.0.0.1 for `kubectl port-forward` (the smoke test checks app and payment-service
# that way). For HTTP, server-side TLS only: callers are still identified by their JWT service tokens, not by
# a client certificate. Kafka and PostgreSQL (Phase 35) and Redis (Phase 36) DO identify their clients by
# certificate: those client certificates are at the end of this file.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-tls
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: ecomdemo
spec:
  secretName: app-tls
  duration: 2160h
  renewBefore: 720h
  dnsNames:
    - app
    - app.ecomdemo
    - app.ecomdemo.svc
    - app.ecomdemo.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: ecomdemo-ca
    kind: ClusterIssuer
---
