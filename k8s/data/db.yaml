# PostgreSQL for ecomdemo-app, the first of six. The other five (k8s/data/*-db.yaml) are the same
# object with a different name, database and Secret - one database per service, as since Phase 20.
#
# A StatefulSet, not a Deployment, and the difference is the point:
#   - a stable identity: the pod is always `db-0`, never `db-7f9c4-x2k1p`;
#   - its OWN volume: `volumeClaimTemplates` gives db-0 a PersistentVolumeClaim that outlives the
#     pod. Delete the pod and the new db-0 mounts the same data. A Deployment's pods are
#     interchangeable, which is exactly what a database's pods are not.
# One replica: this is not a replicated PostgreSQL (that is an operator's job, e.g. CloudNativePG),
# it is one database that Kubernetes restarts and reattaches to its disk.
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/component: database
spec:
  # The DNS name the service connects to (db:5432) - the same name compose used, so the
  # application's configuration did not have to change.
  selector:
    app.kubernetes.io/name: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/component: database
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          # KI-058: TLS only. Postgres refuses a private key it does not own (or one others can read), and a
          # Secret's files belong to root, so the certificate is first copied, as postgres and 0600, into a
          # pod-private volume; then the image's own entrypoint starts the server with TLS on, those files,
          # and pg_hba.conf from the `postgres-hba` ConfigMap (TCP only as `hostssl`). `cert-reload` below
          # repeats the copy when cert-manager renews the certificate. Phase 35: `ssl_ca_file` is the cluster CA
          # (public, so read where the Secret mounts it), against which pg_hba.conf's `clientcert=verify-full`
          # checks each client's certificate.
          command: ["sh", "-c"]
          args:
            - |
              install -o postgres -g postgres -m 0600 /etc/ecomdemo-tls/tls.key /etc/postgres-tls/tls.key
              install -o postgres -g postgres -m 0644 /etc/ecomdemo-tls/tls.crt /etc/postgres-tls/tls.crt
              exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/etc/postgres-tls/tls.crt -c ssl_key_file=/etc/postgres-tls/tls.key -c ssl_ca_file=/etc/ecomdemo-tls/ca.crt -c hba_file=/etc/postgresql-hba/pg_hba.conf
          env:
            - name: POSTGRES_DB
              value: ecomdemo
            - name: POSTGRES_USER
              value: ecomdemo
            # From the OWNING SERVICE's Secret, so the database and its only client read the same
            # value from one place. scripts/k8s-up.sh creates it; it is never in Git.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ecomdemo", "-d", "ecomdemo"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ecomdemo", "-d", "ecomdemo"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - { name: tls, mountPath: /etc/ecomdemo-tls, readOnly: true }
            - { name: server-tls, mountPath: /etc/postgres-tls }
            - { name: hba, mountPath: /etc/postgresql-hba, readOnly: true }
            - { name: socket, mountPath: /var/run/postgresql }
        # KI-058: Postgres reads its certificate at start and on a configuration reload, so a renewal by
        # cert-manager (day 60 of 90) would sit unused until the old certificate expired. This checks the
        # mounted certificate every 30 s; when it changes, it copies it as above and asks the server to
        # reload (`pg_reload_conf()`, through the pod's own socket): no restart, no dropped connection.
        - name: cert-reload
          image: postgres:18-alpine
          command: ["sh", "-c"]
          args:
            - |
              cert=/etc/ecomdemo-tls/tls.crt
              last="$(sha256sum "$cert" | cut -d' ' -f1)"
              while true; do
                sleep "${RELOAD_INTERVAL:-30}"
                now="$(sha256sum "$cert" | cut -d' ' -f1)"
                if [ "$now" != "$last" ]; then
                  if install -o postgres -g postgres -m 0600 /etc/ecomdemo-tls/tls.key /etc/postgres-tls/tls.key \
                    && install -o postgres -g postgres -m 0644 "$cert" /etc/postgres-tls/tls.crt \
                    && psql -h /var/run/postgresql -U ecomdemo -d ecomdemo -Atc 'select pg_reload_conf()' | grep -q t; then
                    echo "reloaded the PostgreSQL certificate"; last="$now"
                  else
                    echo "could not reload the PostgreSQL certificate; retrying"
                  fi
                fi
              done
          volumeMounts:
            - { name: tls, mountPath: /etc/ecomdemo-tls, readOnly: true }
            - { name: server-tls, mountPath: /etc/postgres-tls }
            - { name: socket, mountPath: /var/run/postgresql }
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
      volumes:
        - name: tls
          secret:
            secretName: db-tls
        # The copies postgres may own (see the start command); in memory, never on the volume.
        - name: server-tls
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: hba
          configMap:
            name: postgres-hba
        # The server's Unix socket, shared with cert-reload.
        - name: socket
          emptyDir:
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
