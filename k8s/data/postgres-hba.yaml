# Who may connect to the six PostgreSQL databases, and how (KI-058, Phase 35). Every database StatefulSet mounts
# this file and starts with `-c hba_file=` pointing at it, so it replaces the image's own pg_hba.conf
# (whose `host all all all scram-sha-256` accepts a password over plain TCP).
#
#   local    the Unix socket inside the pod: the probes (pg_isready) and the cert-reload sidecar.
#            Only processes in the pod can reach it, as with the image's own default.
#   hostssl  every TCP connection, and only over TLS: a client that does not start TLS matches no line
#            and is refused ("no pg_hba.conf entry ... no encryption"). The client checks the server's
#            certificate (`sslmode=verify-full`); and the server checks the client (Phase 35):
#              scram-sha-256        the password, as before, AND
#              clientcert=verify-full  a certificate signed by the cluster CA (`ssl_ca_file`) whose common
#                                   name IS the database user ("connection requires a valid client
#                                   certificate" without one; "CN mismatch" in the log for another user's).
#            Two factors: a stolen password is useless without the service's key, and a certificate alone
#            does not log in. (A `map=` from CN to user is not allowed with a password method, which is why
#            the client certificates' CN is the user name itself: k8s/service-certificates.yaml.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ecomdemo
data:
  pg_hba.conf: |
    # TYPE   DATABASE  USER  ADDRESS  METHOD
    local    all       all            trust
    hostssl  all       all   all      scram-sha-256  clientcert=verify-full
