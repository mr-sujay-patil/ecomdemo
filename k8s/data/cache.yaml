# Redis: the catalogue's cache and the gateway's rate-limit counters. A Deployment, not a
# StatefulSet: compose already ran it with no persistence (`--save ''`, no AOF), because everything
# in it can be rebuilt. A restart costs a cold cache and a reset rate limit, nothing more - which
# makes it the kind of pod a Deployment is for.
apiVersion: v1
kind: Service
metadata:
  name: cache
  labels:
    app.kubernetes.io/name: cache
spec:
  selector:
    app.kubernetes.io/name: cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  labels:
    app.kubernetes.io/name: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no",
                 "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 320Mi
