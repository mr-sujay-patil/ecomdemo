# Redis: the catalogue's cache and the gateway's rate-limit counters. A Deployment, not a
# StatefulSet: compose already ran it with no persistence (`--save ''`, no AOF), because everything
# in it can be rebuilt. A restart costs a cold cache and a reset rate limit, nothing more - which
# makes it the kind of pod a Deployment is for.
apiVersion: v1
kind: Service
metadata:
  name: cache
  labels:
    app.kubernetes.io/name: cache
spec:
  selector:
    app.kubernetes.io/name: cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  labels:
    app.kubernetes.io/name: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          # Phase 36: every redis-cli in this pod (the probe, the cert-reload sidecar, the smoke test) presents a
          # client certificate: this pod's own, cache-tls, which carries the `client auth` usage for that reason.
          # The tools already run beside its key, so a second certificate here would prove nothing more.
          # Phase 37: NO shared password any more (KI-050's `--requirepass` is gone, and with it the cache-secrets
          # Secret and REDISCLI_AUTH). Who a client is comes from its certificate, what it may do from the ACL.
          args: ["redis-server", "--save", "", "--appendonly", "no",
                 "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru",
                 # KI-057: TLS ONLY. `--port 0` closes the plain port; the TLS port keeps the number
                 # 6379, so the Service and every client's port are unchanged. The certificate is
                 # cert-manager's (k8s/service-certificates.yaml: cache-tls).
                 "--port", "0", "--tls-port", "6379",
                 "--tls-cert-file", "/etc/ecomdemo-tls/tls.crt",
                 "--tls-key-file", "/etc/ecomdemo-tls/tls.key",
                 # Phase 36: and the CLIENT proves itself too. The handshake fails unless the client
                 # shows a certificate signed by this CA (the cluster CA), so a pod that only has the
                 # password gets no further than TLS. The password above is still asked for after it:
                 # a client needs both, the key it holds and the secret it knows.
                 "--tls-ca-cert-file", "/etc/ecomdemo-tls/ca.crt",
                 "--tls-auth-clients", "yes",
                 # Phase 37 (KI-065): the certificate's CN NAMES THE USER. A connection with CN=catalog is logged
                 # in as the ACL user `catalog` the moment the handshake ends, with no AUTH; a CN that is no user
                 # stays `default`, which is off. What each user may do is the ACL file (k8s/data/cache-acl.yaml).
                 "--tls-auth-clients-user", "CN",
                 "--aclfile", "/etc/ecomdemo-acl/users.acl"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - { name: tls, mountPath: /etc/ecomdemo-tls, readOnly: true }
            - { name: acl, mountPath: /etc/ecomdemo-acl, readOnly: true }
          readinessProbe:
            exec:
              command: ["redis-cli", "--tls", "--cacert", "/etc/ecomdemo-tls/ca.crt",
                        "--cert", "/etc/ecomdemo-tls/tls.crt", "--key", "/etc/ecomdemo-tls/tls.key", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 320Mi
        # KI-057: Redis reads its certificate once, at start, so a certificate cert-manager renews at day 60
        # would sit unused in the volume and Redis would keep serving the old one until it expired at day 90.
        # This sidecar notices the file change and tells Redis to load the new one (`CONFIG SET tls-*`,
        # supported at runtime), so a renewal needs no restart and no outage. Phase 36: it presents the
        # renewed certificate as its client certificate (same CA, so Redis still accepts it). Phase 37: it is the
        # ACL user cache-admin (the certificate's CN), and it also watches the ACL file: when Kubernetes updates the
        # mounted cache-acl ConfigMap, it runs ACL LOAD, so an ACL change needs no restart either. If the new file
        # has an error, Redis refuses it and keeps the ACL it has; the sidecar says so and tries again.
        - name: cert-reload
          image: redis:8-alpine
          command: ["sh", "-c"]
          args:
            - |
              cert=/etc/ecomdemo-tls/tls.crt
              acl=/etc/ecomdemo-acl/users.acl
              last="$(sha256sum "$cert" | cut -d' ' -f1)"
              last_acl="$(sha256sum "$acl" | cut -d' ' -f1)"
              while true; do
                sleep 30
                now_acl="$(sha256sum "$acl" | cut -d' ' -f1)"
                if [ "$now_acl" != "$last_acl" ]; then
                  if redis-cli -h 127.0.0.1 --tls --cacert /etc/ecomdemo-tls/ca.crt \
                       --cert /etc/ecomdemo-tls/tls.crt --key /etc/ecomdemo-tls/tls.key \
                       ACL LOAD | grep -q OK; then
                    echo "reloaded the Redis ACL"; last_acl="$now_acl"
                  else
                    echo "could not reload the Redis ACL (Redis keeps the one it has); retrying"
                  fi
                fi
                now="$(sha256sum "$cert" | cut -d' ' -f1)"
                if [ "$now" != "$last" ]; then
                  if redis-cli -h 127.0.0.1 --tls --cacert /etc/ecomdemo-tls/ca.crt \
                       --cert /etc/ecomdemo-tls/tls.crt --key /etc/ecomdemo-tls/tls.key \
                       CONFIG SET tls-cert-file "$cert" tls-key-file /etc/ecomdemo-tls/tls.key \
                       tls-ca-cert-file /etc/ecomdemo-tls/ca.crt | grep -q OK; then
                    echo "reloaded the Redis certificate"; last="$now"
                  else
                    echo "could not reload the Redis certificate; retrying"
                  fi
                fi
              done
          volumeMounts:
            - { name: tls, mountPath: /etc/ecomdemo-tls, readOnly: true }
            - { name: acl, mountPath: /etc/ecomdemo-acl, readOnly: true }
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
      volumes:
        - name: tls
          secret:
            secretName: cache-tls
        # Phase 37: the ACL file, from Git (k8s/data/cache-acl.yaml).
        - name: acl
          configMap:
            name: cache-acl
