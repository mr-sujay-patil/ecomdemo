# PostgreSQL for payment-service. Same shape as k8s/data/db.yaml, which explains it.
apiVersion: v1
kind: Service
metadata:
  name: payment-db
  labels:
    app.kubernetes.io/name: payment-db
    app.kubernetes.io/component: database
spec:
  # The DNS name the service connects to (payment-db:5432) - the same name compose used, so the
  # application's configuration did not have to change.
  selector:
    app.kubernetes.io/name: payment-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payment-db
  labels:
    app.kubernetes.io/name: payment-db
    app.kubernetes.io/component: database
spec:
  serviceName: payment-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-db
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_DB
              value: payment
            - name: POSTGRES_USER
              value: payment
            # From the OWNING SERVICE's Secret, so the database and its only client read the same
            # value from one place. scripts/k8s-up.sh creates it; it is never in Git.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-service-secrets
                  key: PAYMENT_DB_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "payment", "-d", "payment"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "payment", "-d", "payment"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
