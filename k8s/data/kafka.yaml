# Kafka: one broker in KRaft mode (no ZooKeeper), as in compose. A StatefulSet for the same reason
# the databases are: a topic is a durable log, and the consumer groups' offsets live on this disk.
#
# The listener set is smaller than compose's. Compose had a HOST listener on localhost:29092 for a
# client on the laptop; inside the cluster every client is a pod, and they all reach the broker as
# `kafka:9092` through the Service below. The broker ADVERTISES that name, which is what a client
# connects to after its first request - advertise a name clients cannot resolve and they connect
# once and then fail.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      securityContext:
        fsGroup: 1000          # the image runs as uid 1000; the volume must be writable by it
      containers:
        - name: kafka
          image: apache/kafka:4.2.1
          # KI-059: the keystore is the Secret's key and certificate in one file, written to a pod-private
          # in-memory volume readable by this user only; then the image's own start script.
          command: ["sh", "-c"]
          args:
            - |
              umask 077
              cat /etc/ecomdemo-tls/tls.key /etc/ecomdemo-tls/tls.crt > /etc/kafka-tls/keystore.pem
              exec /etc/kafka/docker/run
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: CLUSTER_ID, value: "ecomdemo-kraft-cluster" }
            # KI-059: the one listener other pods can reach, INTERNAL on 9092, is SSL (the certificate is
            # kafka-tls, read from the keystore the start command writes). The plain ones are bound to the
            # loopback, so only this pod reaches them: CONTROLLER (KRaft), and LOCAL for the broker's own
            # inter-broker traffic, the tools run inside the pod (the smoke test) and the cert-reload sidecar.
            - { name: KAFKA_LISTENERS, value: "INTERNAL://:9092,LOCAL://127.0.0.1:9094,CONTROLLER://127.0.0.1:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:9092,LOCAL://127.0.0.1:9094" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,INTERNAL:SSL,LOCAL:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "LOCAL" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            # One broker is also the whole controller quorum, so it votes for itself.
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@127.0.0.1:9093" }
            # Kafka reads a PEM keystore: the private key (PKCS#8) followed by the certificate chain, one file.
            - { name: KAFKA_SSL_KEYSTORE_TYPE, value: "PEM" }
            - { name: KAFKA_SSL_KEYSTORE_LOCATION, value: "/etc/kafka-tls/keystore.pem" }
            # Phase 35: the SSL listener also authenticates the CLIENT. A client must present a certificate
            # signed by the cluster CA (the truststore, PEM, straight from the Secret); one without, or from
            # another CA, fails the handshake ("certificate_required" / "bad_certificate").
            - { name: KAFKA_SSL_CLIENT_AUTH, value: "required" }
            - { name: KAFKA_SSL_TRUSTSTORE_TYPE, value: "PEM" }
            - { name: KAFKA_SSL_TRUSTSTORE_LOCATION, value: "/etc/ecomdemo-tls/ca.crt" }
            # The certificate's subject becomes the principal: `CN=catalog` is `User:catalog`. Only a plain
            # lower-case name is shortened; any other subject keeps its full DN (`User:CN=...`), which no ACL
            # names. So no certificate can become `ANONYMOUS` (the super user below) or another wildcard.
            - { name: KAFKA_SSL_PRINCIPAL_MAPPING_RULES, value: "RULE:^CN=([a-z0-9-]+)$/$1/,DEFAULT" }
            # Authorization (KRaft's built-in authorizer): a request is refused unless an ACL allows it. The ACLs
            # are k8s/data/kafka-acls.yaml, applied by the `acls` container below.
            - { name: KAFKA_AUTHORIZER_CLASS_NAME, value: "org.apache.kafka.metadata.authorizer.StandardAuthorizer" }
            - { name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND, value: "false" }
            # The plain listeners have no identity: whatever connects to them is `User:ANONYMOUS`. That is the
            # broker itself (its controller and inter-broker traffic are authorized too) and the tools run inside
            # this pod (the ACL sync, cert-reload, the smoke test), so ANONYMOUS must be a super user. Safe only
            # because every plain listener is bound to 127.0.0.1: nothing outside this pod can reach one, and a
            # client on the network always has a certificate identity (the rule above).
            - { name: KAFKA_SUPER_USERS, value: "User:ANONYMOUS" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx512m -Xms512m" }
          ports:
            - name: kafka
              containerPort: 9092
          # A TCP check, not compose's `kafka-cluster.sh cluster-id`. That script starts a SECOND JVM,
          # which inherits KAFKA_HEAP_OPTS - another 512 MB beside the broker's - and could not start
          # within the probe's timeout: the first deployment of this file sat not-Ready for five
          # minutes with the broker running perfectly. It mattered more than it looks, because a
          # Service routes only to READY pods: every init container waiting for kafka:9092 waited
          # too. In KRaft mode the broker opens 9092 only once it has joined the quorum and been
          # unfenced ("Awaiting socket connections"), so an open port is a fair readiness signal.
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - { name: tls, mountPath: /etc/ecomdemo-tls, readOnly: true }
            - { name: server-tls, mountPath: /etc/kafka-tls }
        # KI-059: Kafka reads its keystore at start, and again when the listener's keystore setting is
        # updated at runtime. This checks the mounted certificate every 30 s; when cert-manager has renewed
        # it, it rewrites the keystore and updates the setting (same path) through the pod's own plain
        # listener: Kafka loads the new certificate with no restart and no dropped connection.
        - name: cert-reload
          image: apache/kafka:4.2.1
          command: ["sh", "-c"]
          args:
            - |
              cert=/etc/ecomdemo-tls/tls.crt
              last="$(sha256sum "$cert" | cut -d' ' -f1)"
              while true; do
                sleep "${RELOAD_INTERVAL:-30}"
                now="$(sha256sum "$cert" | cut -d' ' -f1)"
                if [ "$now" != "$last" ]; then
                  if (umask 077 && cat /etc/ecomdemo-tls/tls.key "$cert" > /etc/kafka-tls/keystore.pem.new) \
                    && mv -f /etc/kafka-tls/keystore.pem.new /etc/kafka-tls/keystore.pem \
                    && /opt/kafka/bin/kafka-configs.sh --bootstrap-server 127.0.0.1:9094 --entity-type brokers \
                         --entity-name 1 --alter \
                         --add-config listener.name.internal.ssl.keystore.location=/etc/kafka-tls/keystore.pem \
                         > /dev/null; then
                    echo "reloaded the Kafka certificate"; last="$now"
                  else
                    echo "could not reload the Kafka certificate; retrying"
                  fi
                fi
              done
          env:
            # Only for the short-lived kafka-configs JVM.
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx64m" }
          volumeMounts:
            - { name: tls, mountPath: /etc/ecomdemo-tls, readOnly: true }
            - { name: server-tls, mountPath: /etc/kafka-tls }
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 256Mi
        # Phase 35: makes the broker's ACLs exactly k8s/data/kafka-acls.yaml, through the loopback listener, then
        # idles. The pod is Ready only when this container is, i.e. after the sync: the Service sends no client
        # to a broker that would still refuse it, and the services' init containers wait for that.
        - name: acls
          image: apache/kafka:4.2.1
          command: ["sh", "-c"]
          args:
            - |
              until sh /etc/kafka-acls/sync.sh; do echo "could not sync the ACLs; retrying"; sleep 10; done
              touch /tmp/acls-synced
              trap 'exit 0' TERM
              while true; do sleep 3600 & wait $!; done
          env:
            # Only for the short-lived kafka-acls JVMs.
            - { name: KAFKA_HEAP_OPTS, value: "-Xmx64m" }
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/acls-synced"]
            periodSeconds: 5
          volumeMounts:
            - { name: acls, mountPath: /etc/kafka-acls, readOnly: true }
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tls
          secret:
            secretName: kafka-tls
        - name: acls
          configMap:
            name: kafka-acls
        # The keystore (key and chain in one file); in memory, never on the data volume.
        - name: server-tls
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
