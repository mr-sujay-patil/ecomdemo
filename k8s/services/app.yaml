# ecomdemo-app, the order service: carts, orders, the batch jobs, and both ends of the checkout saga.
#
# ONE replica, deliberately, and the only service here that must not scale out yet. It runs
# scheduled work - the outbox relay every second, the outbox cleanup and the nightly sales report -
# and every replica would run all of it. Two relays reading the same outbox would publish rows twice
# (absorbed downstream, but pointless) and two sales reports would collide on Spring Batch's
# once-per-date rule. Making it scale means electing one leader for the schedules (ShedLock, or a
# Kubernetes Lease), which is a follow-up rather than this phase.
#
# Every service file has the same four objects, explained once here:
#
#   ConfigMap   the service's non-secret settings, as environment variables. Changing one and
#               re-applying does NOT restart the pods; `kubectl rollout restart` does.
#   Secret      NOT in this file and not in Git. scripts/k8s-up.sh creates `<name>-secrets` with the
#               JWT key and the database password. A Secret is only base64-encoded, not encrypted -
#               what makes it safer than a ConfigMap is who may read it (RBAC) and that it can be
#               kept out of the repository, not the encoding.
#   Deployment  how many pods, which image, and how to replace them (see `strategy` and the probes).
#   Service     a stable name and virtual IP in front of whichever pods are Ready right now.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app.kubernetes.io/name: app
data:
  # Phase 33: verify tokens with customer-service's public keys.
  JWT_JWK_SET_URI: "https://customer-service:8083/oauth2/jwks"
  # Phase 33: this service's own token comes from customer-service (its secret is in the Secret).
  SERVICE_TOKEN_URI: "https://customer-service:8083/oauth2/token"
  LOG_FORMAT: "ecs"
  # KI-056: this service serves HTTPS (the certificate is cert-manager's, mounted from <name>-tls) and
  # trusts the cluster CA (init container `trust-ca` builds the JVM truststore).
  SERVER_SSL_BUNDLE: "server"
  SPRING_SSL_BUNDLE_PEM_SERVER_KEYSTORE_CERTIFICATE: "file:/etc/ecomdemo-tls/tls.crt"
  SPRING_SSL_BUNDLE_PEM_SERVER_KEYSTORE_PRIVATEKEY: "file:/etc/ecomdemo-tls/tls.key"
  SPRING_SSL_BUNDLE_PEM_SERVER_RELOAD_ON_UPDATE: "true"
  TRACING_SAMPLING_PROBABILITY: "1.0"
  SPRING_PROFILES_ACTIVE: "dev"
  POSTGRES_HOST: "db"
  # KI-058: the database is TLS-only; the driver checks its certificate and name against the cluster CA
  # (mounted in every pod). Read by Spring Boot into the Hikari pool's driver properties (Flyway uses the same pool).
  SPRING_DATASOURCE_HIKARI_DATASOURCEPROPERTIES_SSLMODE: "verify-full"
  SPRING_DATASOURCE_HIKARI_DATASOURCEPROPERTIES_SSLROOTCERT: "/etc/ecomdemo-tls/ca.crt"
  # Phase 35: the database also checks WHO connects. The driver sends this pod's client certificate (its CN is
  # the database user, "ecomdemo") with the password; the key is PKCS#8 RSA, the PEM form pgjdbc reads. pgjdbc
  # reads both files for every new connection, so a renewal is used by the next connection the pool opens.
  SPRING_DATASOURCE_HIKARI_DATASOURCEPROPERTIES_SSLCERT: "/etc/ecomdemo-client-tls/tls.crt"
  SPRING_DATASOURCE_HIKARI_DATASOURCEPROPERTIES_SSLKEY: "/etc/ecomdemo-client-tls/tls.key"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "ecomdemo"
  POSTGRES_USER: "ecomdemo"
  SPRING_DATA_REDIS_HOST: "cache"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_SSL_ENABLED: "true"   # KI-057: Redis is TLS-only
  # Phase 36: Redis also requires a client certificate (and still the password). The client presents the same client certificate as to PostgreSQL and Kafka
  # through the SSL bundle `redis`, which also trusts the cluster CA. The bundle reloads when cert-manager
  # renews the certificate, and com.ecomdemo.redis (in common) makes Lettuce use the current one on its next
  # connection: Boot alone would keep the certificate of start-up.
  SPRING_DATA_REDIS_SSL_BUNDLE: "redis"
  SPRING_SSL_BUNDLE_PEM_REDIS_KEYSTORE_CERTIFICATE: "file:/etc/ecomdemo-client-tls/tls.crt"
  SPRING_SSL_BUNDLE_PEM_REDIS_KEYSTORE_PRIVATEKEY: "file:/etc/ecomdemo-client-tls/tls.key"
  SPRING_SSL_BUNDLE_PEM_REDIS_TRUSTSTORE_CERTIFICATE: "file:/etc/ecomdemo-client-tls/ca.crt"
  SPRING_SSL_BUNDLE_PEM_REDIS_RELOAD_ON_UPDATE: "true"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  # KI-059: the broker's listener is SSL; the client checks its certificate and name ("kafka") against the
  # cluster CA. Kafka's own name check (ssl.endpoint.identification.algorithm=https) stays on.
  SPRING_KAFKA_SECURITY_PROTOCOL: "SSL"
  # Phase 35: and the broker checks WHO connects: the client presents its certificate, whose CN ("ecomdemo") is
  # its Kafka principal, allowed only what k8s/data/kafka-acls.yaml grants it. One Spring SSL bundle holds both
  # sides (the client certificate and key, the CA it checks the broker against), and every Kafka client of the
  # service gets it. reload-on-update: a renewed certificate is used by the next connection, no restart.
  SPRING_KAFKA_SSL_BUNDLE: "kafka"
  SPRING_SSL_BUNDLE_PEM_KAFKA_KEYSTORE_CERTIFICATE: "file:/etc/ecomdemo-client-tls/tls.crt"
  SPRING_SSL_BUNDLE_PEM_KAFKA_KEYSTORE_PRIVATEKEY: "file:/etc/ecomdemo-client-tls/tls.key"
  SPRING_SSL_BUNDLE_PEM_KAFKA_TRUSTSTORE_CERTIFICATE: "file:/etc/ecomdemo-client-tls/ca.crt"
  SPRING_SSL_BUNDLE_PEM_KAFKA_RELOAD_ON_UPDATE: "true"
  CATALOG_BASE_URL: "https://catalog-service:8081"
  CUSTOMER_BASE_URL: "https://customer-service:8083"
  INVENTORY_BASE_URL: "https://inventory-service:8082"
  # Phase 32: the saga deadline settles overdue orders with payment-service.
  PAYMENT_BASE_URL: "https://payment-service:8086"
  ORDER_SAGA_DEADLINE: "1m"
  JAVA_OPTS: "-XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError"
---
# Where an uploaded CSV is staged and the nightly report is written (BATCH_DIR). A claim of its own
# so a restarted pod can resume a half-finished import - Spring Batch's restart needs the file.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-batch
  labels:
    app.kubernetes.io/name: app
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: ecomdemo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  # A rolling update that never drops below the current count: one NEW pod is started (maxSurge),
  # and an old one is stopped only once the new one is Ready (maxUnavailable 0). With the readiness
  # probe below, that is what makes a deploy invisible to callers.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 5            # how far back `kubectl rollout undo` can go
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/part-of: ecomdemo
    spec:
      # Phase 35: the volumes' files belong to the image's group (gid 1001), so the client key below can be
      # 0440 and still readable by the service, which runs as 1001.
      securityContext:
        fsGroup: 1001
      # Kubernetes has no `depends_on`. Without this, the service would start before its database,
      # fail Flyway, crash, and be restarted with a growing back-off until the database happened
      # to be up. An init container runs to completion BEFORE the application container starts:
      # here it waits until each dependency accepts a TCP connection. It uses the service's own
      # image (Alpine, so it has `nc`), so there is no extra image to pull.
      initContainers:
        # KI-056: the JVM must trust the cluster CA to call other services over HTTPS. This copies the
        # image's own truststore (public CAs included, so outbound calls keep working) and adds the CA
        # from this service's certificate Secret. JAVA_TOOL_OPTIONS on the container points the JVM at it.
        - name: trust-ca
          image: ecomdemo:latest
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              cp "${JAVA_HOME:-/opt/java/openjdk}/lib/security/cacerts" /trust/cacerts
              keytool -importcert -noprompt -trustcacerts -alias ecomdemo-local-ca \
                -file /etc/ecomdemo-tls/ca.crt -keystore /trust/cacerts -storepass changeit
          volumeMounts:
            - { name: tls, mountPath: /etc/ecomdemo-tls, readOnly: true }
            - { name: trust, mountPath: /trust }
          resources:
            limits:
              memory: 192Mi
        - name: wait-for-dependencies
          image: ecomdemo:latest
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              for target in db:5432 cache:6379 kafka:9092; do
                until nc -z "${target%%:*}" "${target##*:}"; do
                  echo "waiting for $target"; sleep 2
                done
              done
          resources:
            limits:
              memory: 64Mi
      terminationGracePeriodSeconds: 40
      containers:
        - name: app
          image: ecomdemo:latest
          # Built locally and loaded into kind by scripts/k8s-up.sh; there is no registry to pull
          # from, and `Never` makes a missing image an immediate, readable error.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          # THREE probes, three questions (Phase 15 built the endpoints; Kubernetes now asks them):
          #   startup    "has it finished starting?" - up to 5 minutes, because a JVM that is still
          #              starting must not be killed by the liveness probe for being slow;
          #   liveness   "is it stuck?" - failing it RESTARTS the container;
          #   readiness  "should it get traffic?" - failing it only takes the pod out of the
          #              Service's endpoints, which is what a rolling update waits for.
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Djavax.net.ssl.trustStore=/trust/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 3
          # The pod is removed from the Service's endpoints at the same moment it is told to stop,
          # and the two travel different paths - so for a few seconds requests can still arrive.
          # Sleeping before SIGTERM lets the endpoint removal propagate first; Spring Boot's
          # graceful shutdown then finishes the requests already in flight.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Requests are what the scheduler reserves and what the HPA measures CPU against; the
          # memory LIMIT is the same as compose's, and JAVA_OPTS keeps the heap at half of it
          # (Phase 10, re-measured before Phase 23). No CPU limit: throttling a JVM's start-up
          # costs more than it protects on a one-node laptop cluster.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - { name: tls, mountPath: /etc/ecomdemo-tls, readOnly: true }
            - { name: trust, mountPath: /trust, readOnly: true }
            - { name: client-tls, mountPath: /etc/ecomdemo-client-tls, readOnly: true }
            - name: batch
              mountPath: /var/lib/ecomdemo/batch
      volumes:
        - name: tls
          secret:
            secretName: app-tls
        # Phase 35: this service's CLIENT certificate, for PostgreSQL and Kafka (k8s/service-certificates.yaml).
        - name: client-tls
          secret:
            secretName: app-client-tls
            # The PostgreSQL driver refuses a key file that others may read (the rule libpq has: 0600 if the
            # user owns it, at most 0640 if root does). A Secret's files are root's and 0644 by default.
            defaultMode: 0440
        - name: trust
          emptyDir: {}
        - name: batch
          persistentVolumeClaim:
            claimName: app-batch
---
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
spec:
  selector:
    app.kubernetes.io/name: app
  ports:
    - name: http
      port: 8080
      targetPort: http
