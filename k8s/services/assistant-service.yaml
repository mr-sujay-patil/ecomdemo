# assistant-service (Phase 29): the shopping assistant. No database - conversations and proposed
# cart additions are in Redis - so a second replica would continue any conversation the first one
# started. One replica here only because a laptop cluster has little memory to spare.
apiVersion: v1
kind: ConfigMap
metadata:
  name: assistant-service-config
  labels:
    app.kubernetes.io/name: assistant-service
data:
  LOG_FORMAT: "ecs"
  TRACING_SAMPLING_PROBABILITY: "1.0"
  SPRING_DATA_REDIS_HOST: "cache"
  SPRING_DATA_REDIS_PORT: "6379"
  CATALOG_BASE_URL: "http://catalog-service:8081"
  APP_BASE_URL: "http://app:8080"
  # No language model in the cluster, like catalog-service: every chat answers 503 "not
  # configured". Both are needed to switch it on - a chat model and an embedding model.
  AI_CHAT_PROVIDER: "none"
  AI_EMBEDDING_PROVIDER: "none"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-service
  labels:
    app.kubernetes.io/name: assistant-service
    app.kubernetes.io/part-of: ecomdemo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: assistant-service
  # A rolling update that never drops below the current count: one NEW pod is started (maxSurge),
  # and an old one is stopped only once the new one is Ready (maxUnavailable 0). With the readiness
  # probe below, that is what makes a deploy invisible to callers.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 5            # how far back `kubectl rollout undo` can go
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assistant-service
        app.kubernetes.io/part-of: ecomdemo
    spec:
      # Kubernetes has no `depends_on`: wait until Redis and the two services it asks accept a TCP
      # connection (see catalog-service.yaml for the pattern).
      initContainers:
        - name: wait-for-dependencies
          image: ecomdemo-assistant:latest
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              for target in cache:6379 catalog-service:8081 app:8080; do
                until nc -z "${target%%:*}" "${target##*:}"; do
                  echo "waiting for $target"; sleep 2
                done
              done
          resources:
            limits:
              memory: 64Mi
      terminationGracePeriodSeconds: 40
      containers:
        - name: assistant-service
          image: ecomdemo-assistant:latest
          # Built locally and loaded into kind by scripts/k8s-up.sh; there is no registry to pull
          # from, and `Never` makes a missing image an immediate, readable error.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8087
          envFrom:
            - configMapRef:
                name: assistant-service-config
            - secretRef:
                name: assistant-service-secrets
          # THREE probes, three questions (Phase 15 built the endpoints; Kubernetes now asks them):
          #   startup    "has it finished starting?" - up to 5 minutes, because a JVM that is still
          #              starting must not be killed by the liveness probe for being slow;
          #   liveness   "is it stuck?" - failing it RESTARTS the container;
          #   readiness  "should it get traffic?" - failing it only takes the pod out of the
          #              Service's endpoints, which is what a rolling update waits for.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          # The pod is removed from the Service's endpoints at the same moment it is told to stop,
          # and the two travel different paths - so for a few seconds requests can still arrive.
          # Sleeping before SIGTERM lets the endpoint removal propagate first; Spring Boot's
          # graceful shutdown then finishes the requests already in flight.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Requests are what the scheduler reserves and what the HPA measures CPU against; the
          # memory LIMIT is the same as compose's, and JAVA_OPTS keeps the heap at half of it
          # (Phase 10, re-measured before Phase 23). No CPU limit: throttling a JVM's start-up
          # costs more than it protects on a one-node laptop cluster.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: assistant-service
  labels:
    app.kubernetes.io/name: assistant-service
spec:
  selector:
    app.kubernetes.io/name: assistant-service
  ports:
    - name: http
      port: 8087
      targetPort: http
