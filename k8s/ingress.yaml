# The Ingress: the cluster's front door, in front of the gateway (Phase 25).
#
# Two layers of "gateway", and they do different jobs. The Ingress controller (Traefik) is
# INFRASTRUCTURE: it gets traffic from outside the cluster to a Service inside it, and could do TLS
# and host-based routing for many applications. gateway-service is APPLICATION: it knows our routes,
# validates JWTs, rate-limits per caller and adds the correlation id (Phase 21). So the Ingress has
# exactly one rule - everything to the gateway - and all the routing that knows about our API stays
# in code, where it is tested.
#
# No `host` on the rule: any host name reaching the node is accepted, so https://localhost:18443 works
# without editing /etc/hosts.
#
# TLS (KI-051): the `tls` section below makes Traefik terminate HTTPS with the certificate in the
# `ecomdemo-tls` Secret, which cert-manager issues and renews (k8s/tls-certificate.yaml, from the
# local CA in platform/ca.yaml). Traffic from Traefik to the gateway and everything behind it stays
# plain HTTP on the cluster network: this protects the leg that crosses the network a client uses,
# not the pod-to-pod hops.
#
# KI-060: `shop.localhost` is listed too. That host's rule is the frontend team's Ingress, not this one;
# the certificate names it (tls-certificate.yaml) so their shop is HTTPS on the same port.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecomdemo
  labels:
    app.kubernetes.io/part-of: ecomdemo
spec:
  ingressClassName: traefik
  tls:
    - hosts: [localhost, shop.localhost]
      secretName: ecomdemo-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  name: http
