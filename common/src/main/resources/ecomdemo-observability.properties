# Observability settings that every service shares (Phase 23).
#
# Each service imports this file with `spring.config.import=classpath:ecomdemo-observability.properties`.
# It lives in `common` for the reason a shared library exists at all: six copies of the same eight
# lines drift. Six services with six sampling rates would not be six decisions, it would be six
# typos waiting to happen, and a trace whose services disagree about sampling arrives in pieces.
#
# PRECEDENCE: an imported file overrides the file that imports it, and environment variables
# override both. So a service cannot quietly change these in its own application.properties (that
# is intended), while compose can still change them per deployment (also intended).

# --- Sampling -----------------------------------------------------------------------------------
# What fraction of NEW traces are recorded. A trace costs memory, network and storage in every
# service it touches, and at real traffic nobody reads 100% of them. 0.1 is Boot's own default and
# the right order of magnitude for production. Compose sets it to 1.0 because a demo on a laptop
# wants every request, and the smoke test needs its checkout's trace to exist.
#
# THE DECISION IS MADE ONCE, AT THE EDGE. Boot's sampler is `parent-based-trace-id-ratio`: a
# request that arrives WITH a `traceparent` header follows that header's sampled flag, and only a
# request with no parent gets a fresh coin toss. The gateway tosses the coin; every service behind
# it obeys. That is what keeps a trace whole - if each service tossed its own coin, a 10% rate
# would give 10% of the gateway's spans, 10% of the app's, and almost never all of one trace.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}

# --- What is NOT traced ------------------------------------------------------------------------
# Observation names are dotted, and `management.observations.enable.<prefix>=false` switches off
# every observation under a prefix before it starts. One family is switched off here, measured in
# Tempo before this was written:
#
#   spring.security  Spring Security observes each of its filter chains, each authentication and
#                    each authorization decision: seven spans per request per service, half a
#                    checkout's trace, and none of them answer a question anyone asks of a trace.
#                    A 401 or 403 still shows - as the status of the service's HTTP span.
#
# The outbox relay's once-a-second @Scheduled tick is ALSO kept out, but not with a property: every
# scheduled method shares the name `tasks.scheduled.execution`, and switching the prefix off would
# silence the nightly jobs too. ecomdemo-app drops only the relay (OutboxObservationConfig).
#
# Health checks and Prometheus scrapes are filtered in code (TracingConfig), because an HTTP
# server observation has one name for every path and the rule needs the path.
management.observations.enable.spring.security=false

# --- Export -------------------------------------------------------------------------------------
# Where finished spans go is NOT set here. Boot creates the OTLP span exporter only when
# `management.opentelemetry.tracing.export.otlp.endpoint` is set, and compose sets it through
# MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT. So `./mvnw spring-boot:run` and every test
# still CREATE spans (trace IDs appear in the logs) but never try to reach a Tempo that is not
# there - the same "deployment decision, not a code decision" as LOG_FORMAT below.
#
# The OpenTelemetry starter also brings a PUSH metrics registry (OTLP). Metrics stay on
# Prometheus' pull model (Phase 15), and left on, this registry would try to POST every metric to
# localhost:4318 once a minute and log a failure each time.
management.otlp.metrics.export.enabled=false

# --- Kafka --------------------------------------------------------------------------------------
# Spring Kafka observes sends and receives only when asked. Observation is what writes the
# `traceparent` header into a produced record and reads it back out on the consumer side; without
# it the trace ends at the producer and the consumer starts a brand-new one. These two properties
# reach the AUTO-CONFIGURED template and listener factory only. A template or factory built by
# hand (the outbox relay's, catalog-service's) has to switch it on itself - see those classes.
# In a service without Kafka they are inert.
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# --- Structured logging (Phase 16, extended to every service in Phase 23) -----------------------
# The format is a deployment decision: EMPTY MEANS PLAIN TEXT, so a laptop stays readable, and
# compose sets LOG_FORMAT=ecs so every container writes JSON for Alloy and Loki. The full
# reasoning (why JSON, why ECS) is in ecomdemo-app's application.properties, where it started.
#
# What Phase 23 adds is the reason it now has to be EVERY service: Micrometer Tracing puts
# `traceId` and `spanId` into the logging MDC for the duration of each span, and the JSON writes
# MDC entries as named fields. A trace ID in the gateway's log, the app's and notification-
# service's is what lets Grafana jump from any one log line to the whole request in Tempo - and
# from a span back to exactly the log lines it wrote. A service that logs plain text is a gap in
# that chain.
logging.structured.format.console=${LOG_FORMAT:}
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=${spring.profiles.active:default}
logging.structured.ecs.service.node-name=${HOSTNAME:}
