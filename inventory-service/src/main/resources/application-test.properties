# The fast suite: H2, no Flyway, no broker.
spring.datasource.url=jdbc:h2:mem:inventory;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# Phase 17's trap, inherited: without this, KafkaAdmin applies its topic beans at startup and every
# @SpringBootTest spends forty-five seconds timing out against a broker that is not there.
spring.kafka.admin.auto-create=false
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:1
spring.kafka.producer.properties.max.block.ms=1000

ecomdemo.jwt.secret=test-secret-that-is-at-least-32-characters-long
