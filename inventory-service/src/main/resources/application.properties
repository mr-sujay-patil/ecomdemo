spring.application.name=inventory-service

# Tracing, sampling and the log format every service shares (Phase 23): see the file itself.
spring.config.import=classpath:ecomdemo-observability.properties

# ---------------------------------------------------------------------------------------------
# Its OWN database, and that is the point of the phase
# ---------------------------------------------------------------------------------------------
# A different host, a different database, a different Flyway history starting at V1. Nothing in
# here can join to `product`, `cart` or `orders`, and that is not a limitation to be worked around
# - it is the boundary. The day somebody needs a join across it, the answer is an API call or an
# event, and the schema is what stops the third option being taken quietly.
spring.datasource.url=jdbc:postgresql://${INVENTORY_DB_HOST:localhost}:${INVENTORY_DB_PORT:5433}/${INVENTORY_DB_NAME:inventory}
spring.datasource.username=${INVENTORY_DB_USER:inventory}
spring.datasource.password=${INVENTORY_DB_PASSWORD:inventory}

# `validate`, never `update`. Flyway owns the schema; Hibernate's job is to notice when the
# entities and the migrations have drifted apart and to refuse to start rather than to "fix" it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

server.port=${INVENTORY_PORT:8082}

# ---------------------------------------------------------------------------------------------
# JWT: this service VALIDATES, it does not issue
# ---------------------------------------------------------------------------------------------
# The same secret as customer-service, because HMAC signing and verification use one key - which
# is also the honest argument FOR asymmetric signing in a real deployment, where five services
# each holding the signing key means five places it can leak. RS256 with a published public key is
# the production answer, and it is recorded in docs/decisions.md rather than pretended away.
#
# What matters for the split is that verification is LOCAL. No service calls customer-service to
# ask whether a token is real; it checks a signature it can check by itself. That is what Phase 9
# bought, and it is why a five-service system does not need an authentication round trip on every
# request.
ecomdemo.jwt.secret=${JWT_SECRET:}
ecomdemo.jwt.issuer=ecomdemo

# ---------------------------------------------------------------------------------------------
# Kafka: publishes stock changes; since Phase 24 also a saga participant (reads orders.created and
# payments.failed, publishes stock-reserved / stock-rejected through the outbox)
# ---------------------------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false

# The Phase 17 lesson, carried over: `send` blocks inside the call waiting for cluster metadata,
# and the default is SIXTY SECONDS. Lowered so that a broker outage cannot become request latency.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=3000

# The consumer side, new in Phase 24, set up exactly as notification-service's (Phase 17's
# reasoning): ErrorHandlingDeserializer so a malformed message is dead-lettered instead of
# stopping the partition for ever; offsets committed by the container only after the listener
# returns, one record at a time. No default value type here - each saga listener names its own.
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecomdemo.*
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# The tag every metric from this service carries, so one Prometheus can tell the services apart.
# Read by MetricsConfig in `common`, which has no default for it - a service that forgets this line
# fails to start rather than publishing untagged metrics that quietly merge with another service's.
ecomdemo.metrics.application=inventory-service

# KI-001: this service publishes its own OpenAPI document at /v3/api-docs, and the gateway serves
# it at /v3/api-docs/<service> in its Swagger UI (http://localhost:8080/swagger-ui.html). The title
# says whose document it is; OpenApiConfig adds the conventions every document shares.
ecomdemo.openapi.title=EcomDemo Inventory API
ecomdemo.openapi.summary=Stock levels and reservations. An ADMIN may read and adjust stock through the gateway; the reservation endpoints are for the order saga.
