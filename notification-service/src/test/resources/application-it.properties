# The *IT suite: a real PostgreSQL and a real Kafka in containers, with Flyway on.
#
# A real broker matters more here than anywhere else in the project. This service's whole job is
# consuming, and the things worth asserting about a consumer - that a redelivery writes nothing twice,
# that a poison message goes to the DLT instead of stopping the partition - are behaviours of Kafka's
# delivery semantics and Spring Kafka's error handling. Neither can be demonstrated against a stub.

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.pool-name=NotificationItPool
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# The listener DOES start here, unlike the fast suite.
spring.kafka.listener.auto-startup=true
spring.kafka.listener.concurrency=1

# Short, so a test that waits for a retry does not wait for a minute.
spring.kafka.consumer.properties.max.poll.interval.ms=10000

ecomdemo.jwt.secret=integration-test-signing-key-32-chars-minimum
ecomdemo.jwt.issuer=ecomdemo
