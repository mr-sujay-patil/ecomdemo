# =============================================================================================
# EcomDemo — the whole system, in two containers
# =============================================================================================
#   docker compose up --build       start everything (add -d to detach)
#   docker compose down             stop and remove the containers, KEEPING the data volume
#   docker compose down -v          ...and delete the database with it
#   docker compose logs -f app      follow the application log
#
# Copy .env.example to .env first. It is gitignored, and it is where the database password and
# the JWT signing key live.
#
# The file is `compose.yaml`, not `docker-compose.yml`: that is the name the Compose
# specification settled on, and `version:` at the top is long obsolete.
#
# PORTS ARE PUBLISHED ON THE LOOPBACK INTERFACE ONLY (KI-003). A bare "8080:8080" listens on every
# interface of the machine, which would put the PostgreSQL databases (default passwords), Redis and
# Kafka (no authentication) in reach of everyone on the same network. Every mapping below is
# "${BIND_ADDRESS:-127.0.0.1}:<host port>:<container port>": your own browser, psql and curl work as
# before, other machines cannot connect. To reach the stack from another machine on purpose, set
# BIND_ADDRESS=0.0.0.0 in .env, knowing what that exposes. scripts/test-compose-ports.sh checks it.

# ---------------------------------------------------------------------------------------------
# Observability settings every Spring service shares (Phase 23)
# ---------------------------------------------------------------------------------------------
# A top-level key starting with `x-` is an EXTENSION FIELD: Compose ignores it, which makes it a
# safe place to hang a YAML anchor (`&name`). Each service merges it into its own environment
# with `<<: *observability-env`, so the six services cannot disagree about where spans go or how
# many are kept - the same reason ecomdemo-observability.properties exists on the Java side.
x-observability-env: &observability-env
  # Structured logging (Phase 16, every service since Phase 23). Empty outside compose, so
  # `./mvnw spring-boot:run` on a laptop keeps the readable pattern layout; `ecs` here because a
  # container's stdout is read by Alloy and parsed as JSON, never by a person scrolling.
  LOG_FORMAT: ${LOG_FORMAT:-ecs}
  # Where finished spans are sent: Tempo's OTLP/HTTP receiver. Setting this is what makes Boot
  # create the exporter at all. There is deliberately no `depends_on: tempo` - tracing is not a
  # reason for a shop to refuse to start. With Tempo down the exporter drops spans and logs a
  # warning; the requests they describe are unaffected.
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
  # 1.0 = record every trace. Right for a laptop and required by the smoke test; production would
  # use something like 0.1 (the default in the properties file explains the trade-off).
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}

services:

  # -------------------------------------------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------------------------------------------
  db:
    image: postgres:18-alpine
    container_name: ecomdemo-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecomdemo}
      POSTGRES_USER: ${POSTGRES_USER:-ecomdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecomdemo}
    ports:
      # Published so psql, DBeaver and the smoke test's schema checks can reach it from the host.
      # The application does NOT use this: it talks to the container directly over the compose
      # network (see the app service). Changing the left-hand side moves the host port and
      # nothing else — that is the one to change if 5432 is already taken locally.
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A VOLUME is storage that outlives the container. A container's own writable layer is
      # destroyed with it, so without this line `docker compose down` would delete the database
      # and every restart would replay every migration into an empty schema. A NAMED volume
      # (rather than a bind mount to a host path) lets Docker own the storage, which keeps file
      # ownership and permissions out of the picture — the thing that most often breaks a
      # database bind mount on macOS and Windows.
      #
      # The mount point is `/var/lib/postgresql`, NOT the `/var/lib/postgresql/data` that every
      # older tutorial shows. The postgres:18 image changed this: it now keeps its data in a
      # major-version subdirectory so that `pg_upgrade --link` can see both versions inside one
      # mount. Mounting the old path makes the container refuse to start — it detects data at a
      # path it considers an "unused mount/volume" and stops rather than risk it.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # `pg_isready` is not "is the container running?" but "is the server accepting
      # connections?" — the distinction the app service depends on below. The port is open for
      # some seconds before that is true, and an application that connects in between dies at
      # startup with a Flyway error.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecomdemo} -d ${POSTGRES_DB:-ecomdemo}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Redis — the cache
  # -------------------------------------------------------------------------------------------
  cache:
    image: redis:8-alpine
    container_name: ecomdemo-cache
    command:
      # `--save ""` turns OFF snapshotting to disk. This is a CACHE: everything in it can be
      # recomputed from PostgreSQL, so persisting it buys nothing and costs fork() pauses and
      # disk. It is also why there is no volume below - losing the whole thing is a slow minute,
      # not an incident.
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      # A hard ceiling, plus what to do when it is reached. Without maxmemory, Redis grows until
      # the container's limit kills it; with it, `allkeys-lru` evicts the least recently used key
      # and carries on. LRU rather than `noeviction` because for a cache, dropping a cold entry is
      # correct behaviour - `noeviction` would start failing writes instead, turning a full cache
      # into an application error.
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
      # KI-050: a client must authenticate. No default on purpose: a password that ships in the
      # repository is not a password, and `:?` makes compose refuse to start rather than run a
      # cache that anyone on the network (see BIND_ADDRESS) could read, flush or poison.
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example)}
    environment:
      # redis-cli reads this, so the healthcheck below and `docker exec ecomdemo-cache redis-cli ...`
      # authenticate without the password being typed or put on a command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example)}
    ports:
      # Published so `redis-cli` and the smoke test can look inside from the host. The
      # application does not use this: it reaches Redis at `cache:6379` over the compose network.
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # The application
  # -------------------------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecomdemo:latest
    container_name: ecomdemo-app
    depends_on:
      db:
        # `service_healthy`, not the bare `depends_on: [db]`. The short form only waits for the
        # container to be STARTED, which for PostgreSQL means "the process exists" — several
        # seconds before it answers. This waits for the health check above to pass.
        condition: service_healthy
      cache:
        condition: service_healthy
      kafka:
        # The application publishes on checkout, so it needs a broker that is genuinely serving
        # requests - not merely a container that has started. Spring's producer would retry
        # anyway, but a checkout during that window would block for `delivery.timeout.ms` and
        # then fail, which is a strange first impression of `docker compose up`.
        condition: service_healthy
    environment:
      <<: *observability-env
      # --- CONTAINER NETWORKING -------------------------------------------------------------
      # `db` is a hostname here, resolved by Compose's own DNS on the network it creates for this
      # project. Not localhost: in a container, localhost is that container. And not 5432 on the
      # host either — this connection never leaves the Docker network, so it works whatever the
      # published host port is, or even if none is published at all.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecomdemo}
      POSTGRES_USER: ${POSTGRES_USER:-ecomdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecomdemo}

      # Phase 33: verify tokens with customer-service's PUBLIC keys; no shared secret any more.
      JWT_JWK_SET_URI: http://customer-service:8083/oauth2/jwks
      # Its own identity when it calls another service: a token from customer-service, scoped.
      SERVICE_TOKEN_URI: http://customer-service:8083/oauth2/token
      SERVICE_CLIENT_SECRET: ${APP_CLIENT_SECRET:-}

      # Redis, reached by service name on the compose network — same reasoning as `db` above.
      SPRING_DATA_REDIS_HOST: cache
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example)}

      # `dev` is the profile that reads POSTGRES_* above. It is named for how it is run, not for
      # what it means; a `prod` profile arrives with the deployment phases.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      # Performance experiments only (Phase 30): the size of the app's database connection pool.
      # The default is exactly what application-dev.properties already says, so leaving this unset
      # changes nothing; scripts/perf-compare.sh sets it to measure other sizes.
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: ${APP_DB_POOL_SIZE:-10}

      # Overrides the Dockerfile's default when set in .env — useful for pinning a heap on a
      # laptop, or adding -XX:+HeapDumpOnOutOfMemoryError while debugging.
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError}

      # Kafka, reached by service name on the compose network - same reasoning as `db`. This is
      # the INTERNAL listener; the published 29092 is for producers running on the host.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Where inventory-service is, on the compose network. The default in
      # application.properties is localhost:8082, which is right for running both from an IDE and
      # wrong inside a container, where localhost is this container.
      INVENTORY_BASE_URL: http://inventory-service:8082
      CATALOG_BASE_URL: http://catalog-service:8081
      CUSTOMER_BASE_URL: http://customer-service:8083

      # Phase 32: the saga deadline asks payment-service to settle an overdue order (and
      # inventory-service, above, to close it). ORDER_SAGA_DEADLINE is how long an order may stay
      # PENDING first; the smoke test's dead-letter scenario waits for it, so it is not made longer
      # here without reason.
      PAYMENT_BASE_URL: http://payment-service:8086
      ORDER_SAGA_DEADLINE: ${ORDER_SAGA_DEADLINE:-1m}

    volumes:
      # The batch working directory (Phase 14). A named volume rather than container-local space,
      # because a restart of a failed import re-reads the file it was given BY PATH: if the
      # staged upload vanished with the container, the run could never be resumed. The reports
      # the nightly job writes are worth keeping for the same undramatic reason.
      #
      # The path matches BATCH_DIR in the Dockerfile, where the directory is created owned by the
      # runtime user - which is what makes the volume inherit that ownership instead of root's.
      - batch-data:/var/lib/ecomdemo/batch
    ports:
      # 8084 ON THE HOST SINCE PHASE 21, and 8080 inside the container still.
      #
      # The gateway now owns host port 8080, because that is the port every client and every smoke
      # check has used since Phase 1 - moving the GATEWAY to a new port instead would have left ~200
      # checks talking to the application directly and proving nothing about routing.
      #
      # Only the mapping changed. In-network the application is still `app:8080`, so Prometheus's
      # scrape target, Alloy's log discovery and the gateway's own route needed no edit at all. What
      # 8084 is for is the WHITE-BOX checks - /actuator/health, /actuator/prometheus, heapdump -
      # which are about this service and must not be answered by the gateway.
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8084}:8080"
    # A limit matters here even locally, because it is what MaxRAMPercentage is a percentage OF.
    # Without one the JVM sizes its heap against the whole host, and the "75% of the container"
    # setting in the Dockerfile silently means "75% of your laptop".
    #
    # 1G since the WSL2 workstation (was 768M, sized for a Mac whose whole Docker VM was 3.9 GB). The
    # Dockerfile's heap share is now 50%: 512 MiB of heap against a measured peak of 112, and 512 MiB
    # for the ~180 MiB this JVM spends outside the heap.
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-1G}
    restart: unless-stopped


  # -------------------------------------------------------------------------------------------
  # inventory-db (Phase 20b) - a database of its OWN, which is the point
  # -------------------------------------------------------------------------------------------
  # A second PostgreSQL rather than a second schema, and the choice was measured rather than
  # assumed: at idle PostgreSQL costs ~31 MiB against a JVM's ~296, so five databases cost about
  # 125 MiB more than one while five JVMs cost about 1.2 GB more. Collapsing to one database with a
  # schema per service would have saved a rounding error and given up the entire subject of the
  # phase. The JVMs get capped instead - see the memory limit on each service.
  inventory-db:
    image: postgres:18-alpine
    container_name: ecomdemo-inventory-db
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory}
      POSTGRES_USER: ${INVENTORY_DB_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
    ports:
      # 5433 on the host, because 5432 is the catalogue's. Inside the network both are 5432 -
      # a container gets its own address, so the ports only collide on the host.
      - "${BIND_ADDRESS:-127.0.0.1}:${INVENTORY_DB_PORT:-5433}:5432"
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data - matching the catalogue's db above.
      # PostgreSQL 18 wants a single mount at the parent and puts its data in a subdirectory of
      # it; mounting the data directory itself makes the container refuse to start with a long
      # explanation about pg_upgrade and mount-point boundaries.
      - inventory-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER:-inventory} -d ${INVENTORY_DB_NAME:-inventory}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # customer-service's database (Phase 20d)
  # -------------------------------------------------------------------------------------------
  customer-db:
    image: postgres:18-alpine
    container_name: ecomdemo-customer-db
    environment:
      POSTGRES_DB: ${CUSTOMER_DB_NAME:-customer}
      POSTGRES_USER: ${CUSTOMER_DB_USER:-customer}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD:-customer}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CUSTOMER_DB_PORT:-5435}:5432"
    volumes:
      # /var/lib/postgresql, NOT .../data - see the note on the first db service.
      - customer-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CUSTOMER_DB_USER:-customer} -d ${CUSTOMER_DB_NAME:-customer}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # customer-service (Phase 20d) - accounts, and the only issuer of user tokens
  # -------------------------------------------------------------------------------------------
  customer-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: customer-service
    image: ecomdemo-customer:latest
    container_name: ecomdemo-customer-service
    depends_on:
      customer-db:
        condition: service_healthy
    environment:
      <<: *observability-env
      CUSTOMER_DB_HOST: customer-db
      CUSTOMER_DB_PORT: 5432
      CUSTOMER_DB_NAME: ${CUSTOMER_DB_NAME:-customer}
      CUSTOMER_DB_USER: ${CUSTOMER_DB_USER:-customer}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:-customer}

      # The SIGNING key, and here it is doing something no other service's copy does: this is the
      # only process that MINTS a user token. The others verify. With HS256 that is a convention
      # rather than a constraint - they hold the same key and could mint one - which is the honest
      # argument for asymmetric signing, recorded in docs/decisions.md.
      # Phase 33: the ONLY signing key in the system (RSA, PKCS#8 base64 on one line; .env.example has
      # the openssl command). No default on purpose: a key in Git is a key everyone has. Unset, the
      # service generates one per run and warns that every token dies with the container.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_SIGNING_KEY_ID: ${JWT_SIGNING_KEY_ID:-key-1}
      # Rotation: the next key is published before it signs (see SigningKeyProperties).
      JWT_NEXT_SIGNING_KEY: ${JWT_NEXT_SIGNING_KEY:-}
      JWT_NEXT_SIGNING_KEY_ID: ${JWT_NEXT_SIGNING_KEY_ID:-key-2}
      JWT_ACTIVE_KEY_ID: ${JWT_ACTIVE_KEY_ID:-}
      # The services allowed to ask /oauth2/token for a token; each caller holds the matching secret.
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:-}
      APP_CLIENT_SECRET: ${APP_CLIENT_SECRET:-}
      CATALOG_CLIENT_SECRET: ${CATALOG_CLIENT_SECRET:-}
      JWT_EXPIRY: ${JWT_EXPIRY:-15m}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CUSTOMER_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          # 768M, like every service since the WSL2 workstation. The old 320M was measured correctly
          # and still wrong: this JVM's NON-heap alone is ~145 MiB, so a 75% heap share of 320M could
          # never fit. See the Dockerfile's JAVA_OPTS and ContainerMemoryBudgetTest.
          memory: ${CUSTOMER_MEMORY_LIMIT:-768M}
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # notification-service's database (Phase 20d)
  # -------------------------------------------------------------------------------------------
  notification-db:
    image: postgres:18-alpine
    container_name: ecomdemo-notification-db
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${NOTIFICATION_DB_PORT:-5436}:5432"
    volumes:
      - notification-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER:-notification} -d ${NOTIFICATION_DB_NAME:-notification}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # notification-service (Phase 20d) - the only service nobody calls
  # -------------------------------------------------------------------------------------------
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: notification-service
    image: ecomdemo-notification:latest
    container_name: ecomdemo-notification-service
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        # Its ONLY input. Without the broker this service has nothing to do at all - unlike the
        # others, which merely lose a feature.
        condition: service_healthy
    environment:
      <<: *observability-env
      NOTIFICATION_DB_HOST: notification-db
      NOTIFICATION_DB_PORT: 5432
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:-notification}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Phase 33: verify tokens with customer-service's PUBLIC keys; no shared secret any more.
      JWT_JWK_SET_URI: http://customer-service:8083/oauth2/jwks
    ports:
      # Published only so the smoke test can read its health and metrics. It has no business API:
      # its SecurityConfig answers denyAll on every other path.
      - "${BIND_ADDRESS:-127.0.0.1}:${NOTIFICATION_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          # 768M (was 320M, at which it idled at 97-98%: ~150 MiB of non-heap plus a heap allowed to
          # reach 240). Not a leak - the heap-to-limit ratio. See the Dockerfile's JAVA_OPTS.
          memory: ${NOTIFICATION_MEMORY_LIMIT:-768M}
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # payment-service's database (Phase 24)
  # -------------------------------------------------------------------------------------------
  payment-db:
    image: postgres:18-alpine
    container_name: ecomdemo-payment-db
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment}
      POSTGRES_USER: ${PAYMENT_DB_USER:-payment}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PAYMENT_DB_PORT:-5437}:5432"
    volumes:
      - payment-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USER:-payment} -d ${PAYMENT_DB_NAME:-payment}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # payment-service (Phase 24) - a MOCK payment provider, the saga's third step
  # -------------------------------------------------------------------------------------------
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: payment-service
    image: ecomdemo-payment:latest
    container_name: ecomdemo-payment-service
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        # Its only input, as for notification-service: a payment starts from a StockReserved event.
        condition: service_healthy
    environment:
      <<: *observability-env
      PAYMENT_DB_HOST: payment-db
      PAYMENT_DB_PORT: 5432
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-payment}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Phase 33: verify tokens with customer-service's PUBLIC keys; no shared secret any more.
      JWT_JWK_SET_URI: http://customer-service:8083/oauth2/jwks
      # Orders with a total ABOVE this are declined - the way to force the saga's failure path.
      PAYMENT_DECLINE_ABOVE: ${PAYMENT_DECLINE_ABOVE:-10000.00}
    ports:
      # Published only for health and metrics, like notification-service. No business API.
      - "${BIND_ADDRESS:-127.0.0.1}:${PAYMENT_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8086/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${PAYMENT_MEMORY_LIMIT:-768M}
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # catalog-service's database (Phase 20c)
  # -------------------------------------------------------------------------------------------
  catalog-db:
    # pgvector's image, not postgres:18-alpine (Phase 28): the same PostgreSQL 18 with the `vector`
    # extension compiled in, which the semantic search's embeddings are stored and searched with.
    # Pinned to the extension's version, because the index format belongs to it. Debian-based, so
    # its text collation differs from Alpine's; V4 rebuilds the two text indexes for that reason.
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: ecomdemo-catalog-db
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:-catalog}
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
    ports:
      # 5434: 5432 is the application's, 5433 is inventory's. Inside the network all three are
      # 5432 - a container gets its own address, so they only collide on the host.
      - "${BIND_ADDRESS:-127.0.0.1}:${CATALOG_DB_PORT:-5434}:5432"
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data - see the note on inventory-db above.
      - catalog-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER:-catalog} -d ${CATALOG_DB_NAME:-catalog}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # catalog-service (Phase 20c) - the catalogue, and the Redis cache that serves it
  # -------------------------------------------------------------------------------------------
  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: catalog-service
    image: ecomdemo-catalog:latest
    container_name: ecomdemo-catalog-service
    depends_on:
      catalog-db:
        condition: service_healthy
      cache:
        # It serves the catalogue from Redis, so a cold start against a missing cache would work
        # but would log a stream of connection failures on the first request of every kind.
        condition: service_healthy
      kafka:
        # It CONSUMES `inventory.stock-changed` - the mirror image of inventory-service, which
        # publishes it. Without the broker the cache would never learn that a sale happened and
        # would serve a stale figure until the TTL rescued it.
        condition: service_healthy
      inventory-service:
        # A product listing shows stock, which is an HTTP call to inventory-service. Not strictly
        # required - the listing degrades rather than fails - but starting in dependency order
        # keeps the first `docker compose up` free of errors that mean nothing.
        condition: service_healthy
    environment:
      <<: *observability-env
      CATALOG_DB_HOST: catalog-db
      CATALOG_DB_PORT: 5432
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:-catalog}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: cache
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example)}
      INVENTORY_BASE_URL: http://inventory-service:8082

      # Performance experiments only (Phase 30), defaults = today's behaviour. CATALOG_CACHE_TYPE=none
      # turns the Redis product cache off (every read goes to PostgreSQL and inventory-service);
      # CATALOG_DB_POOL_SIZE is Hikari's pool, whose Spring Boot default is also 10. See
      # scripts/perf-compare.sh and docs/performance.md.
      SPRING_CACHE_TYPE: ${CATALOG_CACHE_TYPE:-redis}
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: ${CATALOG_DB_POOL_SIZE:-10}

      # The same secret every other service holds, because HMAC verifies with the key it signs
      # with. That is the honest argument for asymmetric signing in a real deployment, and it is
      # recorded in docs/decisions.md rather than pretended away.
      # Phase 33: verify tokens with customer-service's PUBLIC keys; no shared secret any more.
      JWT_JWK_SET_URI: http://customer-service:8083/oauth2/jwks
      # Its own identity when it calls another service: a token from customer-service, scoped.
      SERVICE_TOKEN_URI: http://customer-service:8083/oauth2/token
      SERVICE_CLIENT_SECRET: ${CATALOG_CLIENT_SECRET:-}

      # Phase 27: the language model behind POST /api/products/{id}/generate-description. `none`
      # (the default) starts the service without one, and that endpoint answers 503. The key comes
      # from .env or the shell and is never written here.
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      AI_TIMEOUT: ${AI_TIMEOUT:-30s}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Phase 28: the embedding model for semantic search, chosen independently of the chat model.
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-none}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # Overrides of the model's own defaults (application.properties); empty means "use them".
      SEARCH_MIN_SIMILARITY: ${SEARCH_MIN_SIMILARITY:-}
      SEARCH_DOCUMENT_PREFIX: ${SEARCH_DOCUMENT_PREFIX:-}
      SEARCH_QUERY_PREFIX: ${SEARCH_QUERY_PREFIX:-}
      # Ollama runs on the HOST, not in compose (it wants the GPU and several GB of model files),
      # and a container reaches the host through host.docker.internal - see extra_hosts.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      # Docker Desktop defines host.docker.internal by itself; Docker Engine on Linux does not,
      # and `host-gateway` is how compose asks for the same thing there.
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CATALOG_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          # 768M (was 384M, sized to fit five services into the Mac's 3.8 GB Docker VM, where it
          # reached 98% after the rate-limit burst). ~175 MiB of non-heap; see the Dockerfile.
          memory: ${CATALOG_MEMORY_LIMIT:-768M}
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # inventory-service (Phase 20b) - the first service extracted
  # -------------------------------------------------------------------------------------------
  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The one Dockerfile packages whichever module this names. Everything else about the image
        # - the JRE, the layering, the non-root user, the JVM flags - is identical by construction.
        MODULE: inventory-service
    image: ecomdemo-inventory:latest
    container_name: ecomdemo-inventory-service
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *observability-env
      INVENTORY_DB_HOST: inventory-db
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:-inventory}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:-inventory}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Until Phase 33 every service held the same HS256 secret, and so could mint tokens as well
      # as check them. Now only customer-service holds a (private) key.
      # Phase 33: verify tokens with customer-service's PUBLIC keys; no shared secret any more.
      JWT_JWK_SET_URI: http://customer-service:8083/oauth2/jwks
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${INVENTORY_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          # MaxRAMPercentage in the Dockerfile is a percentage OF THIS - without a limit the JVM
          # sizes its heap against the whole host, and six JVMs each claiming half of it is the
          # mistake the app's comment warns about, six times over. 768M since the WSL2 workstation
          # (was 384M, the price of fitting five services into the Mac's 3.8 GB Docker VM).
          memory: ${INVENTORY_MEMORY_LIMIT:-768M}
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # assistant-service (Phase 29) - the shopping assistant
  # -------------------------------------------------------------------------------------------
  # No database: it asks catalog-service and the application, always with the customer's own
  # token, and keeps conversations and proposed cart additions in Redis (assistant:* keys, all with
  # an expiry). The models are the same switches as catalog-service's; with none (the default) it
  # starts and answers every chat with a 503 that says how to set it up.
  assistant-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: assistant-service
    image: ecomdemo-assistant:latest
    container_name: ecomdemo-assistant-service
    depends_on:
      cache:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      <<: *observability-env
      SPRING_DATA_REDIS_HOST: cache
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example)}
      # Where it asks, by compose service name. Never through the gateway: that would count the
      # assistant's calls against the customer's rate limit, and add a hop for nothing.
      CATALOG_BASE_URL: http://catalog-service:8081
      APP_BASE_URL: http://app:8080

      # Phase 33: verify tokens with customer-service's PUBLIC keys; no shared secret any more.
      JWT_JWK_SET_URI: http://customer-service:8083/oauth2/jwks

      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Its own chat model variables: calling tools reliably is a harder job than catalog's
      # descriptions. qwen2.5:7b passed the evaluation set where llama3.2 did not (see
      # application.properties); `ollama pull qwen2.5:7b` on the host.
      ASSISTANT_OPENAI_MODEL: ${ASSISTANT_OPENAI_MODEL:-gpt-4.1-mini}
      ASSISTANT_OLLAMA_MODEL: ${ASSISTANT_OLLAMA_MODEL:-qwen2.5:7b}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_TIMEOUT: ${AI_TIMEOUT:-30s}
      POLICY_MIN_SIMILARITY: ${POLICY_MIN_SIMILARITY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ASSISTANT_PORT:-8087}:8087"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8087/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${ASSISTANT_MEMORY_LIMIT:-768M}
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # gateway-service (Phase 21) - the single door, and the only port a client needs
  # -------------------------------------------------------------------------------------------
  # It publishes 8080, which the application used to. Everything a client does now arrives here:
  # routing, token validation at the edge, a Redis-backed rate limit and the correlation ID that
  # every service downstream logs under.
  #
  # The one REACTIVE container in the stack. Netty rather than Tomcat, because a gateway's work is
  # holding many mostly-idle connections while somebody else answers - and because the Redis rate
  # limiter has no servlet equivalent.
  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gateway-service
    image: ecomdemo-gateway:latest
    container_name: ecomdemo-gateway-service
    depends_on:
      cache:
        # The rate limiter's store. The limiter fails OPEN if Redis is unreachable - a gateway that
        # refused every request because its counter was down would be a worse outage than the one it
        # is protecting against - so this is about a clean start rather than correctness.
        condition: service_healthy
      # Every route's target. `service_healthy` on all five means the first request after
      # `docker compose up --wait` meets a service that can answer, instead of the 503 a route to a
      # starting container produces.
      app:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      assistant-service:
        condition: service_healthy
    environment:
      <<: *observability-env
      # The route targets, by compose service name on the internal network. The application is
      # still `app:8080` in here - only its HOST mapping moved to 8084.
      APP_BASE_URL: http://app:8080
      CATALOG_BASE_URL: http://catalog-service:8081
      CUSTOMER_BASE_URL: http://customer-service:8083
      INVENTORY_BASE_URL: http://inventory-service:8082
      ASSISTANT_BASE_URL: http://assistant-service:8087

      SPRING_DATA_REDIS_HOST: cache
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (see .env.example)}

      # The edge VALIDATES tokens; customer-service is the only service that issues them.
      # Phase 33: verify tokens with customer-service's PUBLIC keys; no shared secret any more.
      JWT_JWK_SET_URI: http://customer-service:8083/oauth2/jwks
      # Its own identity when it calls another service: a token from customer-service, scoped.
      SERVICE_TOKEN_URI: http://customer-service:8083/oauth2/token
      SERVICE_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8088/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          # 768M (was 320M). A gateway holds no database connections and no JPA metamodel, and its
          # heap peaked at 63 MiB - but its non-heap is still ~107 MiB (Netty, the reactive stack),
          # and a 75% heap share of 320M left too little for it. See the Dockerfile's JAVA_OPTS.
          memory: ${GATEWAY_MEMORY_LIMIT:-768M}
    restart: unless-stopped


  # -------------------------------------------------------------------------------------------
  # Prometheus (Phase 15) - scrapes the application and stores the numbers
  # -------------------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: ecomdemo-prometheus
    depends_on:
      app:
        # Not strictly required - Prometheus is perfectly happy to scrape a target that is not up
        # yet and record `up 0` for it, which is the correct behaviour. Waiting anyway just means
        # the first graph anyone opens is not five minutes of a red line from before the app
        # started.
        condition: service_healthy
    command:
      # The defaults are repeated explicitly because naming `--config.file` at all discards the
      # image's whole default command, including the storage path and the web listener.
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # How long samples are kept. 15 days is the image default; it is written out because
      # retention is a decision, and a disk that fills up silently is the usual way people find
      # out they never made it.
      - --storage.tsdb.retention.time=15d
      # Lets `curl -X POST localhost:19090/-/reload` apply a changed prometheus.yml or alerts.yml
      # without losing the stored data to a restart.
      - --web.enable-lifecycle
    volumes:
      # Read-only. Prometheus has no business writing to its own configuration, and :ro means a
      # typo in a future command line cannot overwrite what is in Git.
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-19090}:9090"
    healthcheck:
      # The image has no shell and no curl or wget: it is built FROM scratch with the binary and
      # nothing else. Prometheus itself is therefore the only thing available to make an HTTP
      # request with, and `promtool` ships in the image for exactly this.
      test: ["CMD", "promtool", "check", "healthy", "--url=http://localhost:9090"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Grafana (Phase 15) - draws what Prometheus stored
  # -------------------------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:12.3.1
    container_name: ecomdemo-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Local credentials for a local dashboard. Overridable from .env, and the same reasoning as
      # POSTGRES_PASSWORD applies: this is a throwaway default for a stack that is not reachable
      # from anywhere, not a pattern to copy into a deployment.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Nobody can sign themselves up on a single-user local Grafana, and leaving it on just
      # means a "Sign up" button that does nothing useful.
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The dashboard the home page opens on, so `docker compose up` to a useful graph is one
      # click rather than three. Grafana wants the path it serves the provisioned file from.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ecomdemo.json
      # Turns off the phone-home to grafana.com for version checks and usage statistics. A
      # monitoring tool that makes outbound connections nobody asked for is worth switching off
      # by default, and it also stops the log filling with failures when there is no internet.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Provisioning: read at startup, and the reason this dashboard exists without anyone
      # clicking anything. All read-only - the files in Git are the source of truth.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Grafana's own SQLite database: users, preferences, and which panel you collapsed. Not the
      # dashboards, which come from the mount above - so losing this volume costs nothing that
      # matters.
      - grafana-data:/var/lib/grafana
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Loki (Phase 16) - stores the logs
  # -------------------------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.8
    container_name: ecomdemo-loki
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      # The chunks and the index. Named, and worth keeping across a restart for the same reason
      # Prometheus' data is: the logs anyone wants are the ones from before the restart.
      - loki-data:/loki
    ports:
      # Published so the smoke test can query the API from the host. Grafana does not use this -
      # it reaches Loki at `loki:3100` on the compose network.
      - "${BIND_ADDRESS:-127.0.0.1}:${LOKI_PORT:-3100}:3100"
    # NO HEALTHCHECK, deliberately. Loki's image is DISTROLESS - `docker exec ecomdemo-loki ls`
    # answers "executable file not found", because the whole filesystem is the loki binary and its
    # certificates. There is no shell, no wget and no curl for a `test:` command to use, and Loki
    # itself has no client subcommand to make a request with (unlike Prometheus, which ships
    # promtool and is why THAT container has a health check). The readiness endpoint is real and
    # worth calling - http://localhost:3100/ready returns 503 with a reason until the ingester has
    # joined its own ring - but nothing inside this container can call it, so the check lives in
    # scripts/smoke-test.sh, on the host, where curl exists.
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Tempo (Phase 23) - stores the traces
  # -------------------------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:3.0.3
    container_name: ecomdemo-tempo
    command:
      - -target=all
      - -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      # The write-ahead log and the trace blocks. Named for the same reason Loki's are: the trace
      # anyone wants to look at is usually the one from before the restart.
      - tempo-data:/var/tempo
    ports:
      # The query API, published for the smoke test and for curl. Grafana reaches Tempo at
      # `tempo:3200`, and the services send spans to `tempo:4318`, both on the compose network -
      # so the OTLP receiver needs no host port at all.
      - "${BIND_ADDRESS:-127.0.0.1}:${TEMPO_PORT:-3200}:3200"
    # NO HEALTHCHECK, for the reason Loki has none: the image is distroless (no shell, no wget).
    # GET /ready is the real readiness signal, and scripts/smoke-test.sh calls it from the host.
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Grafana Alloy (Phase 16) - reads the containers' logs and pushes them to Loki
  # -------------------------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: ecomdemo-alloy
    depends_on:
      loki:
        # `service_started`, because Loki has no health check to wait for (see above) - and it
        # matters less here than anywhere else in this file. `loki.write` buffers in memory and
        # retries with backoff, so an Alloy that starts before Loki is ready loses nothing; it
        # logs a few connection refusals and then catches up. That is the whole design: the log
        # pipeline is allowed to be eventually consistent, which is what lets the application
        # never wait for it.
        condition: service_started
    command:
      - run
      # Without an explicit listen address the UI binds to 127.0.0.1 INSIDE the container, which
      # is unreachable from the host however the port is published.
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # THE DOCKER SOCKET. This is how Alloy discovers containers and reads their log streams -
      # and it is worth being clear-eyed about: the socket is the daemon's full API, so a
      # container that can write to it can start a privileged container and own the host. It is
      # mounted READ-ONLY here, which prevents nothing at the API level (the socket is
      # bidirectional) but does state the intent, and it is the reason a real deployment collects
      # logs with a node agent under its own service account rather than handing the daemon to a
      # workload. On a laptop, with this project's own containers, it is an acceptable trade.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Alloy's own state: the positions file that remembers how far it has read in each
      # container's log, so a restart resumes instead of re-shipping everything.
      - alloy-data:/var/lib/alloy/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ALLOY_PORT:-12345}:12345"
    healthcheck:
      # A PORT check, not an HTTP one, and the comment is here so nobody reads it as more than it
      # is: this image has bash but neither curl nor wget, and bash's /dev/tcp pseudo-device is
      # the only way left to ask a question over TCP. It proves the server is listening, not that
      # the pipeline is shipping anything. What the pipeline is actually doing is on the Alloy UI
      # at http://localhost:12345 and in the smoke test's Loki queries.
      #
      # `bash` EXPLICITLY, not CMD-SHELL. /dev/tcp is a bash builtin, not a real device: there is
      # no such file, and the kernel knows nothing about it. CMD-SHELL runs /bin/sh, which in this
      # Ubuntu-based image is dash - so the first version of this check answered
      # "cannot create /dev/tcp/localhost/12345: Directory nonexistent" and marked a container
      # unhealthy 371 times in a row while it was shipping logs perfectly well. A health check
      # that is wrong is worse than none: it is a red light nobody trusts.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/12345"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Apache Kafka (Phase 17) - the log everything is published to
  # -------------------------------------------------------------------------------------------
  # KRAFT MODE, so there is no ZooKeeper here. Until Kafka 3.3 a cluster needed a second
  # distributed system beside it just to agree on who the controller was and where the partitions
  # lived; KRaft moves that metadata into a Kafka log managed by the brokers themselves. One
  # process instead of two, and one fewer thing to operate - ZooKeeper is removed entirely as of
  # Kafka 4.0, so every `zookeeper:` service in an older tutorial is now wrong rather than merely
  # dated.
  #
  # One broker, which is honest about what this is: a laptop. It means replication-factor 1 for
  # every topic, so a broker failure loses data and `min.insync.replicas` has nothing to say. A
  # real cluster is three brokers with replication-factor 3 - the reasoning is in the README, and
  # nothing in the application code changes between the two.
  kafka:
    image: apache/kafka:4.2.1
    container_name: ecomdemo-kafka
    environment:
      # This broker is both broker AND controller. In a real cluster those are usually separate
      # roles on separate machines; combining them is the standard single-node arrangement.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # THE LISTENER SET IS THE PART THAT GOES WRONG. A Kafka client does not keep talking to the
      # address it dialled: it asks for metadata and is told where the partition leaders are, then
      # connects to THOSE addresses. So the broker must advertise an address that is correct from
      # the caller's point of view - and "the caller" here is two different places at once. The
      # app and Kafka UI reach it as `kafka:9092` over the compose network; a producer on the host
      # reaches it as `localhost:29092`. One advertised address cannot be right for both, which is
      # why there are two listeners rather than one.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # With one broker, every one of these MUST be 1. They default to 3, and a default of 3 on a
      # single-node cluster fails at the moment the topic is first needed rather than at startup -
      # which is a confusing way to learn that consumer offsets are themselves a Kafka topic.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1

      # A consumer group rebalance waits this long for stragglers to join before assigning
      # partitions. The default of 3s is aimed at a production cluster where instances come and
      # go; locally it just adds three seconds to every start, and to every test.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Topics are created by the application (see KafkaTopicsConfig), never by a producer's first
      # send. Auto-creation invents a topic with default partitions and replication the moment
      # somebody typos a name, and the typo then looks like it worked.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ecomdemo-kraft-cluster

      # WHERE THE BROKER WRITES - and it must be where the volume below is mounted (KI-039).
      # Mounting a volume does not move anything: the broker writes where ITS configuration says, and
      # the image's default is a directory under /tmp, inside the container. Until this line existed
      # `kafka-data` was mounted and empty, every `docker compose down` removed the container and
      # with it every topic, every consumer group's offset and every message, while the PostgreSQL
      # volumes next to it survived. Nothing failed and nothing logged: the broker just started empty.
      # Kubernetes had always set this (k8s/data/kafka.yaml); KafkaStorageConfigTest keeps the two
      # in step and ComposeKafkaPersistenceIT proves the broker honours it.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      # Only the HOST listener is published. 9092 stays inside the compose network.
      - "${BIND_ADDRESS:-127.0.0.1}:${KAFKA_PORT:-29092}:29092"
    healthcheck:
      # Asks the broker to describe the cluster, which fails until it is genuinely serving
      # requests - unlike a port check, which passes while KRaft is still electing a controller.
      # The image ships the CLI, so unlike Loki there is something here to ask with.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Kafka UI (Phase 17) - a window into the log
  # -------------------------------------------------------------------------------------------
  # Not required by anything: the application, the tests and the smoke test all work without it.
  # It is here because a topic is otherwise invisible, and "the message is on the topic" is much
  # easier to believe once you have watched it arrive, seen which partition it landed in, and read
  # the key it was routed by.
  kafka-ui:
    # OPT-IN since Phase 20b: `docker compose --profile tools up -d`.
    #
    # It idles at ~242 MiB, which was affordable with one JVM in the stack and is not with five.
    # It is a developer's window onto the broker, not part of the system, so it is the first thing
    # that should give way when the budget tightens - and unlike shrinking a heap, switching it off
    # costs nothing anyone can observe.
    profiles: ["tools"]
    image: kafbat/kafka-ui:v1.5.0
    container_name: ecomdemo-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: ecomdemo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${KAFKA_UI_PORT:-8090}:8080"
    restart: unless-stopped

volumes:
  # Named `postgres-data` and created as <project>_postgres-data. `docker compose down` leaves it
  # alone; `docker compose down -v` removes it. `docker volume ls` shows what is on the machine.
  customer-data:
  notification-data:
  payment-data:
  catalog-data:
  inventory-data:

  postgres-data:

  # Uploads staged for the import, the error files beside them, and the nightly sales reports.
  batch-data:

  # Prometheus' time-series database. Worth keeping across a restart for the same reason any
  # monitoring data is: the graph you want is almost always the one from before the thing broke.
  prometheus-data:

  # Grafana's SQLite state. Deliberately NOT where the dashboards live.
  grafana-data:

  # Loki's chunks and index.
  loki-data:

  # Tempo's write-ahead log and trace blocks (Phase 23).
  tempo-data:

  # Alloy's read positions, so a restart does not re-ship every container's whole log.
  alloy-data:

  # Kafka's log segments and its KRaft metadata. A topic is a durable log, and losing this volume
  # loses every message on it along with the consumer group offsets.
  kafka-data:
