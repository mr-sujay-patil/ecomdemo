# =============================================================================================
# EcomDemo — the whole system, in two containers
# =============================================================================================
#   docker compose up --build       start everything (add -d to detach)
#   docker compose down             stop and remove the containers, KEEPING the data volume
#   docker compose down -v          ...and delete the database with it
#   docker compose logs -f app      follow the application log
#
# Copy .env.example to .env first. It is gitignored, and it is where the database password and
# the JWT signing key live.
#
# The file is `compose.yaml`, not `docker-compose.yml`: that is the name the Compose
# specification settled on, and `version:` at the top is long obsolete.

services:

  # -------------------------------------------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------------------------------------------
  db:
    image: postgres:18-alpine
    container_name: ecomdemo-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecomdemo}
      POSTGRES_USER: ${POSTGRES_USER:-ecomdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecomdemo}
    ports:
      # Published so psql, DBeaver and the smoke test's schema checks can reach it from the host.
      # The application does NOT use this: it talks to the container directly over the compose
      # network (see the app service). Changing the left-hand side moves the host port and
      # nothing else — that is the one to change if 5432 is already taken locally.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A VOLUME is storage that outlives the container. A container's own writable layer is
      # destroyed with it, so without this line `docker compose down` would delete the database
      # and every restart would replay every migration into an empty schema. A NAMED volume
      # (rather than a bind mount to a host path) lets Docker own the storage, which keeps file
      # ownership and permissions out of the picture — the thing that most often breaks a
      # database bind mount on macOS and Windows.
      #
      # The mount point is `/var/lib/postgresql`, NOT the `/var/lib/postgresql/data` that every
      # older tutorial shows. The postgres:18 image changed this: it now keeps its data in a
      # major-version subdirectory so that `pg_upgrade --link` can see both versions inside one
      # mount. Mounting the old path makes the container refuse to start — it detects data at a
      # path it considers an "unused mount/volume" and stops rather than risk it.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # `pg_isready` is not "is the container running?" but "is the server accepting
      # connections?" — the distinction the app service depends on below. The port is open for
      # some seconds before that is true, and an application that connects in between dies at
      # startup with a Flyway error.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecomdemo} -d ${POSTGRES_DB:-ecomdemo}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Redis — the cache
  # -------------------------------------------------------------------------------------------
  cache:
    image: redis:8-alpine
    container_name: ecomdemo-cache
    command:
      # `--save ""` turns OFF snapshotting to disk. This is a CACHE: everything in it can be
      # recomputed from PostgreSQL, so persisting it buys nothing and costs fork() pauses and
      # disk. It is also why there is no volume below - losing the whole thing is a slow minute,
      # not an incident.
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      # A hard ceiling, plus what to do when it is reached. Without maxmemory, Redis grows until
      # the container's limit kills it; with it, `allkeys-lru` evicts the least recently used key
      # and carries on. LRU rather than `noeviction` because for a cache, dropping a cold entry is
      # correct behaviour - `noeviction` would start failing writes instead, turning a full cache
      # into an application error.
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      # Published so `redis-cli` and the smoke test can look inside from the host. The
      # application does not use this: it reaches Redis at `cache:6379` over the compose network.
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # The application
  # -------------------------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecomdemo:latest
    container_name: ecomdemo-app
    depends_on:
      db:
        # `service_healthy`, not the bare `depends_on: [db]`. The short form only waits for the
        # container to be STARTED, which for PostgreSQL means "the process exists" — several
        # seconds before it answers. This waits for the health check above to pass.
        condition: service_healthy
      cache:
        condition: service_healthy
      kafka:
        # The application publishes on checkout, so it needs a broker that is genuinely serving
        # requests - not merely a container that has started. Spring's producer would retry
        # anyway, but a checkout during that window would block for `delivery.timeout.ms` and
        # then fail, which is a strange first impression of `docker compose up`.
        condition: service_healthy
    environment:
      # --- CONTAINER NETWORKING -------------------------------------------------------------
      # `db` is a hostname here, resolved by Compose's own DNS on the network it creates for this
      # project. Not localhost: in a container, localhost is that container. And not 5432 on the
      # host either — this connection never leaves the Docker network, so it works whatever the
      # published host port is, or even if none is published at all.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecomdemo}
      POSTGRES_USER: ${POSTGRES_USER:-ecomdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecomdemo}

      # The JWT signing key (Phase 9). Deliberately no default: an unset value reaches the
      # application as empty, which makes it generate a random key and warn that tokens die with
      # the container. Putting a real default here would be a signing key in Git.
      JWT_SECRET: ${JWT_SECRET:-}

      # Redis, reached by service name on the compose network — same reasoning as `db` above.
      SPRING_DATA_REDIS_HOST: cache
      SPRING_DATA_REDIS_PORT: 6379

      # `dev` is the profile that reads POSTGRES_* above. It is named for how it is run, not for
      # what it means; a `prod` profile arrives with the deployment phases.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      # Overrides the Dockerfile's default when set in .env — useful for pinning a heap on a
      # laptop, or adding -XX:+HeapDumpOnOutOfMemoryError while debugging.
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}

      # Kafka, reached by service name on the compose network - same reasoning as `db`. This is
      # the INTERNAL listener; the published 29092 is for producers running on the host.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Where inventory-service is, on the compose network. The default in
      # application.properties is localhost:8082, which is right for running both from an IDE and
      # wrong inside a container, where localhost is this container.
      INVENTORY_BASE_URL: http://inventory-service:8082
      CATALOG_BASE_URL: http://catalog-service:8081

      # Structured logging (Phase 16). Empty everywhere else, so `./mvnw spring-boot:run` on a
      # laptop keeps the readable pattern layout; `ecs` here because this container's stdout is
      # read by Alloy and parsed as JSON, never by a person scrolling. See the logging section of
      # application.properties.
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
    volumes:
      # The batch working directory (Phase 14). A named volume rather than container-local space,
      # because a restart of a failed import re-reads the file it was given BY PATH: if the
      # staged upload vanished with the container, the run could never be resumed. The reports
      # the nightly job writes are worth keeping for the same undramatic reason.
      #
      # The path matches BATCH_DIR in the Dockerfile, where the directory is created owned by the
      # runtime user - which is what makes the volume inherit that ownership instead of root's.
      - batch-data:/var/lib/ecomdemo/batch
    ports:
      - "${APP_PORT:-8080}:8080"
    # A limit matters here even locally, because it is what MaxRAMPercentage is a percentage OF.
    # Without one the JVM sizes its heap against the whole host, and the "75% of the container"
    # setting in the Dockerfile silently means "75% of your laptop".
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-768M}
    restart: unless-stopped


  # -------------------------------------------------------------------------------------------
  # inventory-db (Phase 20b) - a database of its OWN, which is the point
  # -------------------------------------------------------------------------------------------
  # A second PostgreSQL rather than a second schema, and the choice was measured rather than
  # assumed: at idle PostgreSQL costs ~31 MiB against a JVM's ~296, so five databases cost about
  # 125 MiB more than one while five JVMs cost about 1.2 GB more. Collapsing to one database with a
  # schema per service would have saved a rounding error and given up the entire subject of the
  # phase. The JVMs get capped instead - see the memory limit on each service.
  inventory-db:
    image: postgres:18-alpine
    container_name: ecomdemo-inventory-db
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory}
      POSTGRES_USER: ${INVENTORY_DB_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
    ports:
      # 5433 on the host, because 5432 is the catalogue's. Inside the network both are 5432 -
      # a container gets its own address, so the ports only collide on the host.
      - "${INVENTORY_DB_PORT:-5433}:5432"
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data - matching the catalogue's db above.
      # PostgreSQL 18 wants a single mount at the parent and puts its data in a subdirectory of
      # it; mounting the data directory itself makes the container refuse to start with a long
      # explanation about pg_upgrade and mount-point boundaries.
      - inventory-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER:-inventory} -d ${INVENTORY_DB_NAME:-inventory}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # catalog-service's database (Phase 20c)
  # -------------------------------------------------------------------------------------------
  catalog-db:
    image: postgres:18-alpine
    container_name: ecomdemo-catalog-db
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:-catalog}
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
    ports:
      # 5434: 5432 is the application's, 5433 is inventory's. Inside the network all three are
      # 5432 - a container gets its own address, so they only collide on the host.
      - "${CATALOG_DB_PORT:-5434}:5432"
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data - see the note on inventory-db above.
      - catalog-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER:-catalog} -d ${CATALOG_DB_NAME:-catalog}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # catalog-service (Phase 20c) - the catalogue, and the Redis cache that serves it
  # -------------------------------------------------------------------------------------------
  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: catalog-service
    image: ecomdemo-catalog:latest
    container_name: ecomdemo-catalog-service
    depends_on:
      catalog-db:
        condition: service_healthy
      cache:
        # It serves the catalogue from Redis, so a cold start against a missing cache would work
        # but would log a stream of connection failures on the first request of every kind.
        condition: service_healthy
      kafka:
        # It CONSUMES `inventory.stock-changed` - the mirror image of inventory-service, which
        # publishes it. Without the broker the cache would never learn that a sale happened and
        # would serve a stale figure until the TTL rescued it.
        condition: service_healthy
      inventory-service:
        # A product listing shows stock, which is an HTTP call to inventory-service. Not strictly
        # required - the listing degrades rather than fails - but starting in dependency order
        # keeps the first `docker compose up` free of errors that mean nothing.
        condition: service_healthy
    environment:
      CATALOG_DB_HOST: catalog-db
      CATALOG_DB_PORT: 5432
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:-catalog}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: cache
      SPRING_DATA_REDIS_PORT: 6379
      INVENTORY_BASE_URL: http://inventory-service:8082

      # The same secret every other service holds, because HMAC verifies with the key it signs
      # with. That is the honest argument for asymmetric signing in a real deployment, and it is
      # recorded in docs/decisions.md rather than pretended away.
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "${CATALOG_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          # 384M, the same cap inventory-service gets. MEASURED rather than guessed: with two
          # services running, inventory-service idled at 185 MiB against this limit and the whole
          # stack at 1.4 GB against a 3.8 GB ceiling. A third service costs about 205 MiB with its
          # database, which is why the memory risk 20a called "the open risk" is not the binding
          # constraint it looked like.
          memory: ${CATALOG_MEMORY_LIMIT:-384M}
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # inventory-service (Phase 20b) - the first service extracted
  # -------------------------------------------------------------------------------------------
  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The one Dockerfile packages whichever module this names. Everything else about the image
        # - the JRE, the layering, the non-root user, the JVM flags - is identical by construction.
        MODULE: inventory-service
    image: ecomdemo-inventory:latest
    container_name: ecomdemo-inventory-service
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      INVENTORY_DB_HOST: inventory-db
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:-inventory}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:-inventory}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # The SAME secret the application verifies with, because HMAC signs and verifies with one
      # key. That is also the honest argument for asymmetric signing in a real deployment: five
      # services each holding the signing key is five places it can leak. Recorded in
      # docs/decisions.md rather than pretended away.
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "${INVENTORY_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          # 384M, not the app's 768M, and this number is what makes five services fit at all.
          # MaxRAMPercentage in the Dockerfile is a percentage OF THIS - without a limit the JVM
          # sizes its heap against the whole Docker VM, and five JVMs each claiming 75% of 3.8 GB
          # is the mistake the app's comment warns about, five times over. This service holds one
          # table and one topic; it does not need what a monolith needed.
          memory: ${INVENTORY_MEMORY_LIMIT:-384M}
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Prometheus (Phase 15) - scrapes the application and stores the numbers
  # -------------------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: ecomdemo-prometheus
    depends_on:
      app:
        # Not strictly required - Prometheus is perfectly happy to scrape a target that is not up
        # yet and record `up 0` for it, which is the correct behaviour. Waiting anyway just means
        # the first graph anyone opens is not five minutes of a red line from before the app
        # started.
        condition: service_healthy
    command:
      # The defaults are repeated explicitly because naming `--config.file` at all discards the
      # image's whole default command, including the storage path and the web listener.
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # How long samples are kept. 15 days is the image default; it is written out because
      # retention is a decision, and a disk that fills up silently is the usual way people find
      # out they never made it.
      - --storage.tsdb.retention.time=15d
      # Lets `curl -X POST localhost:9090/-/reload` apply a changed prometheus.yml or alerts.yml
      # without losing the stored data to a restart.
      - --web.enable-lifecycle
    volumes:
      # Read-only. Prometheus has no business writing to its own configuration, and :ro means a
      # typo in a future command line cannot overwrite what is in Git.
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      # The image has no shell and no curl or wget: it is built FROM scratch with the binary and
      # nothing else. Prometheus itself is therefore the only thing available to make an HTTP
      # request with, and `promtool` ships in the image for exactly this.
      test: ["CMD", "promtool", "check", "healthy", "--url=http://localhost:9090"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Grafana (Phase 15) - draws what Prometheus stored
  # -------------------------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:12.3.1
    container_name: ecomdemo-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Local credentials for a local dashboard. Overridable from .env, and the same reasoning as
      # POSTGRES_PASSWORD applies: this is a throwaway default for a stack that is not reachable
      # from anywhere, not a pattern to copy into a deployment.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Nobody can sign themselves up on a single-user local Grafana, and leaving it on just
      # means a "Sign up" button that does nothing useful.
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The dashboard the home page opens on, so `docker compose up` to a useful graph is one
      # click rather than three. Grafana wants the path it serves the provisioned file from.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ecomdemo.json
      # Turns off the phone-home to grafana.com for version checks and usage statistics. A
      # monitoring tool that makes outbound connections nobody asked for is worth switching off
      # by default, and it also stops the log filling with failures when there is no internet.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Provisioning: read at startup, and the reason this dashboard exists without anyone
      # clicking anything. All read-only - the files in Git are the source of truth.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Grafana's own SQLite database: users, preferences, and which panel you collapsed. Not the
      # dashboards, which come from the mount above - so losing this volume costs nothing that
      # matters.
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Loki (Phase 16) - stores the logs
  # -------------------------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.8
    container_name: ecomdemo-loki
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      # The chunks and the index. Named, and worth keeping across a restart for the same reason
      # Prometheus' data is: the logs anyone wants are the ones from before the restart.
      - loki-data:/loki
    ports:
      # Published so the smoke test can query the API from the host. Grafana does not use this -
      # it reaches Loki at `loki:3100` on the compose network.
      - "${LOKI_PORT:-3100}:3100"
    # NO HEALTHCHECK, deliberately. Loki's image is DISTROLESS - `docker exec ecomdemo-loki ls`
    # answers "executable file not found", because the whole filesystem is the loki binary and its
    # certificates. There is no shell, no wget and no curl for a `test:` command to use, and Loki
    # itself has no client subcommand to make a request with (unlike Prometheus, which ships
    # promtool and is why THAT container has a health check). The readiness endpoint is real and
    # worth calling - http://localhost:3100/ready returns 503 with a reason until the ingester has
    # joined its own ring - but nothing inside this container can call it, so the check lives in
    # scripts/smoke-test.sh, on the host, where curl exists.
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Grafana Alloy (Phase 16) - reads the containers' logs and pushes them to Loki
  # -------------------------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: ecomdemo-alloy
    depends_on:
      loki:
        # `service_started`, because Loki has no health check to wait for (see above) - and it
        # matters less here than anywhere else in this file. `loki.write` buffers in memory and
        # retries with backoff, so an Alloy that starts before Loki is ready loses nothing; it
        # logs a few connection refusals and then catches up. That is the whole design: the log
        # pipeline is allowed to be eventually consistent, which is what lets the application
        # never wait for it.
        condition: service_started
    command:
      - run
      # Without an explicit listen address the UI binds to 127.0.0.1 INSIDE the container, which
      # is unreachable from the host however the port is published.
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # THE DOCKER SOCKET. This is how Alloy discovers containers and reads their log streams -
      # and it is worth being clear-eyed about: the socket is the daemon's full API, so a
      # container that can write to it can start a privileged container and own the host. It is
      # mounted READ-ONLY here, which prevents nothing at the API level (the socket is
      # bidirectional) but does state the intent, and it is the reason a real deployment collects
      # logs with a node agent under its own service account rather than handing the daemon to a
      # workload. On a laptop, with this project's own containers, it is an acceptable trade.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Alloy's own state: the positions file that remembers how far it has read in each
      # container's log, so a restart resumes instead of re-shipping everything.
      - alloy-data:/var/lib/alloy/data
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    healthcheck:
      # A PORT check, not an HTTP one, and the comment is here so nobody reads it as more than it
      # is: this image has bash but neither curl nor wget, and bash's /dev/tcp pseudo-device is
      # the only way left to ask a question over TCP. It proves the server is listening, not that
      # the pipeline is shipping anything. What the pipeline is actually doing is on the Alloy UI
      # at http://localhost:12345 and in the smoke test's Loki queries.
      #
      # `bash` EXPLICITLY, not CMD-SHELL. /dev/tcp is a bash builtin, not a real device: there is
      # no such file, and the kernel knows nothing about it. CMD-SHELL runs /bin/sh, which in this
      # Ubuntu-based image is dash - so the first version of this check answered
      # "cannot create /dev/tcp/localhost/12345: Directory nonexistent" and marked a container
      # unhealthy 371 times in a row while it was shipping logs perfectly well. A health check
      # that is wrong is worse than none: it is a red light nobody trusts.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/12345"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Apache Kafka (Phase 17) - the log everything is published to
  # -------------------------------------------------------------------------------------------
  # KRAFT MODE, so there is no ZooKeeper here. Until Kafka 3.3 a cluster needed a second
  # distributed system beside it just to agree on who the controller was and where the partitions
  # lived; KRaft moves that metadata into a Kafka log managed by the brokers themselves. One
  # process instead of two, and one fewer thing to operate - ZooKeeper is removed entirely as of
  # Kafka 4.0, so every `zookeeper:` service in an older tutorial is now wrong rather than merely
  # dated.
  #
  # One broker, which is honest about what this is: a laptop. It means replication-factor 1 for
  # every topic, so a broker failure loses data and `min.insync.replicas` has nothing to say. A
  # real cluster is three brokers with replication-factor 3 - the reasoning is in the README, and
  # nothing in the application code changes between the two.
  kafka:
    image: apache/kafka:4.2.1
    container_name: ecomdemo-kafka
    environment:
      # This broker is both broker AND controller. In a real cluster those are usually separate
      # roles on separate machines; combining them is the standard single-node arrangement.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # THE LISTENER SET IS THE PART THAT GOES WRONG. A Kafka client does not keep talking to the
      # address it dialled: it asks for metadata and is told where the partition leaders are, then
      # connects to THOSE addresses. So the broker must advertise an address that is correct from
      # the caller's point of view - and "the caller" here is two different places at once. The
      # app and Kafka UI reach it as `kafka:9092` over the compose network; a producer on the host
      # reaches it as `localhost:29092`. One advertised address cannot be right for both, which is
      # why there are two listeners rather than one.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # With one broker, every one of these MUST be 1. They default to 3, and a default of 3 on a
      # single-node cluster fails at the moment the topic is first needed rather than at startup -
      # which is a confusing way to learn that consumer offsets are themselves a Kafka topic.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1

      # A consumer group rebalance waits this long for stragglers to join before assigning
      # partitions. The default of 3s is aimed at a production cluster where instances come and
      # go; locally it just adds three seconds to every start, and to every test.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Topics are created by the application (see KafkaTopicsConfig), never by a producer's first
      # send. Auto-creation invents a topic with default partitions and replication the moment
      # somebody typos a name, and the typo then looks like it worked.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ecomdemo-kraft-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      # Only the HOST listener is published. 9092 stays inside the compose network.
      - "${KAFKA_PORT:-29092}:29092"
    healthcheck:
      # Asks the broker to describe the cluster, which fails until it is genuinely serving
      # requests - unlike a port check, which passes while KRaft is still electing a controller.
      # The image ships the CLI, so unlike Loki there is something here to ask with.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Kafka UI (Phase 17) - a window into the log
  # -------------------------------------------------------------------------------------------
  # Not required by anything: the application, the tests and the smoke test all work without it.
  # It is here because a topic is otherwise invisible, and "the message is on the topic" is much
  # easier to believe once you have watched it arrive, seen which partition it landed in, and read
  # the key it was routed by.
  kafka-ui:
    # OPT-IN since Phase 20b: `docker compose --profile tools up -d`.
    #
    # It idles at ~242 MiB, which was affordable with one JVM in the stack and is not with five.
    # It is a developer's window onto the broker, not part of the system, so it is the first thing
    # that should give way when the budget tightens - and unlike shrinking a heap, switching it off
    # costs nothing anyone can observe.
    profiles: ["tools"]
    image: kafbat/kafka-ui:v1.5.0
    container_name: ecomdemo-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: ecomdemo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    restart: unless-stopped

volumes:
  # Named `postgres-data` and created as <project>_postgres-data. `docker compose down` leaves it
  # alone; `docker compose down -v` removes it. `docker volume ls` shows what is on the machine.
  catalog-data:
  inventory-data:

  postgres-data:

  # Uploads staged for the import, the error files beside them, and the nightly sales reports.
  batch-data:

  # Prometheus' time-series database. Worth keeping across a restart for the same reason any
  # monitoring data is: the graph you want is almost always the one from before the thing broke.
  prometheus-data:

  # Grafana's SQLite state. Deliberately NOT where the dashboards live.
  grafana-data:

  # Loki's chunks and index.
  loki-data:

  # Alloy's read positions, so a restart does not re-ship every container's whole log.
  alloy-data:

  # Kafka's log segments and its KRaft metadata. A topic is a durable log, and losing this volume
  # loses every message on it along with the consumer group offsets.
  kafka-data:
