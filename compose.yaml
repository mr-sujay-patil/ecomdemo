# =============================================================================================
# EcomDemo — the whole system, in two containers
# =============================================================================================
#   docker compose up --build       start everything (add -d to detach)
#   docker compose down             stop and remove the containers, KEEPING the data volume
#   docker compose down -v          ...and delete the database with it
#   docker compose logs -f app      follow the application log
#
# Copy .env.example to .env first. It is gitignored, and it is where the database password and
# the JWT signing key live.
#
# The file is `compose.yaml`, not `docker-compose.yml`: that is the name the Compose
# specification settled on, and `version:` at the top is long obsolete.

services:

  # -------------------------------------------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------------------------------------------
  db:
    image: postgres:18-alpine
    container_name: ecomdemo-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecomdemo}
      POSTGRES_USER: ${POSTGRES_USER:-ecomdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecomdemo}
    ports:
      # Published so psql, DBeaver and the smoke test's schema checks can reach it from the host.
      # The application does NOT use this: it talks to the container directly over the compose
      # network (see the app service). Changing the left-hand side moves the host port and
      # nothing else — that is the one to change if 5432 is already taken locally.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A VOLUME is storage that outlives the container. A container's own writable layer is
      # destroyed with it, so without this line `docker compose down` would delete the database
      # and every restart would replay every migration into an empty schema. A NAMED volume
      # (rather than a bind mount to a host path) lets Docker own the storage, which keeps file
      # ownership and permissions out of the picture — the thing that most often breaks a
      # database bind mount on macOS and Windows.
      #
      # The mount point is `/var/lib/postgresql`, NOT the `/var/lib/postgresql/data` that every
      # older tutorial shows. The postgres:18 image changed this: it now keeps its data in a
      # major-version subdirectory so that `pg_upgrade --link` can see both versions inside one
      # mount. Mounting the old path makes the container refuse to start — it detects data at a
      # path it considers an "unused mount/volume" and stops rather than risk it.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # `pg_isready` is not "is the container running?" but "is the server accepting
      # connections?" — the distinction the app service depends on below. The port is open for
      # some seconds before that is true, and an application that connects in between dies at
      # startup with a Flyway error.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecomdemo} -d ${POSTGRES_DB:-ecomdemo}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Redis — the cache
  # -------------------------------------------------------------------------------------------
  cache:
    image: redis:8-alpine
    container_name: ecomdemo-cache
    command:
      # `--save ""` turns OFF snapshotting to disk. This is a CACHE: everything in it can be
      # recomputed from PostgreSQL, so persisting it buys nothing and costs fork() pauses and
      # disk. It is also why there is no volume below - losing the whole thing is a slow minute,
      # not an incident.
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      # A hard ceiling, plus what to do when it is reached. Without maxmemory, Redis grows until
      # the container's limit kills it; with it, `allkeys-lru` evicts the least recently used key
      # and carries on. LRU rather than `noeviction` because for a cache, dropping a cold entry is
      # correct behaviour - `noeviction` would start failing writes instead, turning a full cache
      # into an application error.
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      # Published so `redis-cli` and the smoke test can look inside from the host. The
      # application does not use this: it reaches Redis at `cache:6379` over the compose network.
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # The application
  # -------------------------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecomdemo:latest
    container_name: ecomdemo-app
    depends_on:
      db:
        # `service_healthy`, not the bare `depends_on: [db]`. The short form only waits for the
        # container to be STARTED, which for PostgreSQL means "the process exists" — several
        # seconds before it answers. This waits for the health check above to pass.
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      # --- CONTAINER NETWORKING -------------------------------------------------------------
      # `db` is a hostname here, resolved by Compose's own DNS on the network it creates for this
      # project. Not localhost: in a container, localhost is that container. And not 5432 on the
      # host either — this connection never leaves the Docker network, so it works whatever the
      # published host port is, or even if none is published at all.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecomdemo}
      POSTGRES_USER: ${POSTGRES_USER:-ecomdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecomdemo}

      # The JWT signing key (Phase 9). Deliberately no default: an unset value reaches the
      # application as empty, which makes it generate a random key and warn that tokens die with
      # the container. Putting a real default here would be a signing key in Git.
      JWT_SECRET: ${JWT_SECRET:-}

      # Redis, reached by service name on the compose network — same reasoning as `db` above.
      SPRING_DATA_REDIS_HOST: cache
      SPRING_DATA_REDIS_PORT: 6379

      # `dev` is the profile that reads POSTGRES_* above. It is named for how it is run, not for
      # what it means; a `prod` profile arrives with the deployment phases.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      # Overrides the Dockerfile's default when set in .env — useful for pinning a heap on a
      # laptop, or adding -XX:+HeapDumpOnOutOfMemoryError while debugging.
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    volumes:
      # The batch working directory (Phase 14). A named volume rather than container-local space,
      # because a restart of a failed import re-reads the file it was given BY PATH: if the
      # staged upload vanished with the container, the run could never be resumed. The reports
      # the nightly job writes are worth keeping for the same undramatic reason.
      #
      # The path matches BATCH_DIR in the Dockerfile, where the directory is created owned by the
      # runtime user - which is what makes the volume inherit that ownership instead of root's.
      - batch-data:/var/lib/ecomdemo/batch
    ports:
      - "${APP_PORT:-8080}:8080"
    # A limit matters here even locally, because it is what MaxRAMPercentage is a percentage OF.
    # Without one the JVM sizes its heap against the whole host, and the "75% of the container"
    # setting in the Dockerfile silently means "75% of your laptop".
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-768M}
    restart: unless-stopped


  # -------------------------------------------------------------------------------------------
  # Prometheus (Phase 15) - scrapes the application and stores the numbers
  # -------------------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: ecomdemo-prometheus
    depends_on:
      app:
        # Not strictly required - Prometheus is perfectly happy to scrape a target that is not up
        # yet and record `up 0` for it, which is the correct behaviour. Waiting anyway just means
        # the first graph anyone opens is not five minutes of a red line from before the app
        # started.
        condition: service_healthy
    command:
      # The defaults are repeated explicitly because naming `--config.file` at all discards the
      # image's whole default command, including the storage path and the web listener.
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # How long samples are kept. 15 days is the image default; it is written out because
      # retention is a decision, and a disk that fills up silently is the usual way people find
      # out they never made it.
      - --storage.tsdb.retention.time=15d
      # Lets `curl -X POST localhost:9090/-/reload` apply a changed prometheus.yml or alerts.yml
      # without losing the stored data to a restart.
      - --web.enable-lifecycle
    volumes:
      # Read-only. Prometheus has no business writing to its own configuration, and :ro means a
      # typo in a future command line cannot overwrite what is in Git.
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      # The image has no shell and no curl or wget: it is built FROM scratch with the binary and
      # nothing else. Prometheus itself is therefore the only thing available to make an HTTP
      # request with, and `promtool` ships in the image for exactly this.
      test: ["CMD", "promtool", "check", "healthy", "--url=http://localhost:9090"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # -------------------------------------------------------------------------------------------
  # Grafana (Phase 15) - draws what Prometheus stored
  # -------------------------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:12.3.1
    container_name: ecomdemo-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Local credentials for a local dashboard. Overridable from .env, and the same reasoning as
      # POSTGRES_PASSWORD applies: this is a throwaway default for a stack that is not reachable
      # from anywhere, not a pattern to copy into a deployment.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Nobody can sign themselves up on a single-user local Grafana, and leaving it on just
      # means a "Sign up" button that does nothing useful.
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The dashboard the home page opens on, so `docker compose up` to a useful graph is one
      # click rather than three. Grafana wants the path it serves the provisioned file from.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ecomdemo.json
      # Turns off the phone-home to grafana.com for version checks and usage statistics. A
      # monitoring tool that makes outbound connections nobody asked for is worth switching off
      # by default, and it also stops the log filling with failures when there is no internet.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      # Provisioning: read at startup, and the reason this dashboard exists without anyone
      # clicking anything. All read-only - the files in Git are the source of truth.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Grafana's own SQLite database: users, preferences, and which panel you collapsed. Not the
      # dashboards, which come from the mount above - so losing this volume costs nothing that
      # matters.
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  # Named `postgres-data` and created as <project>_postgres-data. `docker compose down` leaves it
  # alone; `docker compose down -v` removes it. `docker volume ls` shows what is on the machine.
  postgres-data:

  # Uploads staged for the import, the error files beside them, and the nightly sales reports.
  batch-data:

  # Prometheus' time-series database. Worth keeping across a restart for the same reason any
  # monitoring data is: the graph you want is almost always the one from before the thing broke.
  prometheus-data:

  # Grafana's SQLite state. Deliberately NOT where the dashboards live.
  grafana-data:
