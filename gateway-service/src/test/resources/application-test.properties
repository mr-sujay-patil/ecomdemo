# A fixed secret for the tests, so a minted token and the gateway agree.
#
# It is 48 characters because HS256 refuses anything under 32 bytes - JwtKeyConfig turns that into a
# message rather than a stack trace. This value is test-only and deliberately obvious; the real one
# arrives as JWT_SECRET from the environment and never appears in the repository.
ecomdemo.jwt.secret=test-only-signing-key-for-gateway-tests-0123456789
ecomdemo.jwt.issuer=ecomdemo
ecomdemo.jwt.expiry=15m

# The routes' targets do not need to be listening: every claim these tests make is decided before the
# proxy call. See GatewayTest for why that is a feature rather than a shortcut.
logging.level.org.springframework.cloud.gateway=WARN
