spring.application.name=ecomdemo

# --- H2 in-memory database -------------------------------------------------
# DB_CLOSE_DELAY=-1 keeps the database alive while the JVM runs, not just while
# the first connection is open. Everything is lost on restart; Phase 4 swaps in
# PostgreSQL.
spring.datasource.url=jdbc:h2:mem:ecomdemo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Browse the data at http://localhost:8080/h2-console (JDBC URL above, user sa, no password).
spring.h2.console.enabled=true

# --- JPA / Hibernate -------------------------------------------------------
# Hibernate generates the schema from the entities. Phase 5 replaces this with
# Flyway migrations, which is what you want once data has to survive a deploy.
spring.jpa.hibernate.ddl-auto=create-drop

# Run data.sql AFTER Hibernate has created the tables. Without this, script-based
# initialisation happens first and fails because the tables do not exist yet.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=embedded

# Set to true to watch the SQL Hibernate generates - useful for seeing the JOIN
# FETCH queries and the N+1 problem they avoid.
spring.jpa.show-sql=false
