spring.application.name=ecomdemo

# --- Profiles ---------------------------------------------------------------
# Everything in THIS file applies to every profile. Anything that differs between running the
# application and running the test suite lives in application-<profile>.properties, and a profile
# file wins over this one.
#
#   dev   -> PostgreSQL on localhost (see the README for the docker run command)
#   test  -> in-memory H2, activated by the surefire configuration in pom.xml
#
# `dev` is the default so that `./mvnw spring-boot:run` works with no extra arguments. Override it
# from outside with SPRING_PROFILES_ACTIVE=... or --spring.profiles.active=...
spring.profiles.active=dev

# --- JPA / Hibernate -------------------------------------------------------
# `validate` means: on startup, compare the entities against the schema that is already there and
# fail fast if they disagree. Hibernate no longer creates or alters anything - Flyway does.
#
# The previous value, `update`, is the one to be afraid of in production. It looks at the
# entities, guesses the ALTER statements needed to close the gap, and runs them unreviewed on
# whatever database it is pointed at. It only ever adds, never removes, so a renamed field
# silently leaves the old column behind holding the real data; it has no idea how to move data;
# it runs a different set of statements on every environment depending on that environment's
# current state; and nothing is recorded, so nobody can say what it did or undo it. `validate`
# turns that guesswork into a check, and the ALTERs become reviewed files in Git.
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway ----------------------------------------------------------------
# Enabled by the starter as soon as flyway-core is on the classpath; the location below is also
# the default. It is written out because it is a contract: `V<version>__<description>.sql` files
# in src/main/resources/db/migration, applied in version order, each recorded once in
# `flyway_schema_history` with a checksum of its contents.
spring.flyway.locations=classpath:db/migration

# Fail rather than guess if Flyway ever meets a database that already has tables but no history
# table (an old ddl-auto=update database, for instance). Turning this on would make Flyway write
# a baseline row and skip straight to the newest migration, leaving a schema nobody verified.
spring.flyway.baseline-on-migrate=false

# Refuse to start when a migration already applied has been edited since (its checksum no longer
# matches) or has disappeared. This is the check that enforces "never edit an applied migration".
spring.flyway.validate-on-migrate=true

# Open Session In View is ON by default: it holds the Hibernate session open for the whole
# HTTP request, so a lazy association touched during JSON serialisation quietly triggers another
# query instead of failing. That hides N+1 problems and makes the web layer behave differently
# from tests. Turning it off means the repositories must fetch everything the caller needs -
# which is what the JOIN FETCH queries in CartRepository and OrderRepository do.
spring.jpa.open-in-view=false

# Set to true to watch the SQL Hibernate generates - useful for seeing the JOIN
# FETCH queries and the N+1 problem they avoid.
spring.jpa.show-sql=false

# --- OpenAPI / Swagger UI --------------------------------------------------
# Both paths are springdoc's defaults; they are written out here so the contract is visible in
# config rather than only in the library, and so a later phase that moves them behind a gateway
# has one obvious place to change.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Show the endpoints grouped by @Tag in the order the tags are declared, and the operations
# within a tag by HTTP method, instead of springdoc's non-deterministic scan order.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Swagger UI's "Try it out" is the whole point of shipping the UI in a learning project, so it
# stays on. Phase 8 (Spring Security) is where access to these paths gets decided.
springdoc.swagger-ui.try-it-out-enabled=true

# --- JWT (Phase 9) ---------------------------------------------------------
# The HMAC signing key. It comes from the environment and has NO default in this file on purpose:
# a signing key committed to Git is a signing key everyone has, and anybody holding it can mint a
# token for any account with any role. When the variable is unset the application generates a
# random key at startup and warns that tokens will not survive a restart - see JwtConfig.
#
#   JWT_SECRET='at-least-32-characters-of-random-text' ./mvnw spring-boot:run
ecomdemo.jwt.secret=${JWT_SECRET:}

# Written into `iss` and required back on the way in, so a token minted by another system is
# rejected here even if it were signed with the same key.
ecomdemo.jwt.issuer=ecomdemo

# Short, because a JWT cannot be withdrawn. Nothing consults the database once a token is issued,
# so a role taken away - or an account deleted - stays effective until this elapses. Fifteen
# minutes keeps that window small; a refresh token is what makes a short expiry comfortable for
# users, and this phase deliberately does not add one.
ecomdemo.jwt.expiry=15m

# --- Spring Batch (Phase 14) ------------------------------------------------
# OFF. Spring Boot's JobLauncherApplicationRunner runs EVERY Job bean it can find once the
# context is up, which is right for a batch application launched from the command line and wrong
# for a web application that happens to contain jobs: a restart would re-import whatever file the
# last upload left on disk, and the sales report would run at boot rather than at 02:00.
#
# The jobs here have their own triggers - an ADMIN upload endpoint for the import, a cron for the
# report - so nothing should start one just because the application did.
spring.batch.job.enabled=false

# Where the jobs read and write files.
#
# One directory tree, under a base that defaults to ./batch and is overridden in the container
# (see compose.yaml, which mounts a volume there). Uploads are staged rather than streamed
# straight into the job, because a restart re-reads the SAME file by path: a job whose input
# lived only in the request body could never be restarted at all.
ecomdemo.batch.directory=${BATCH_DIR:./batch}

# Chunk size: how many rows are read and processed before ONE transaction commits them.
#
# This is the knob the whole framework turns on. Too small and the job pays a commit per handful
# of rows; too large and a single failure rolls back a lot of work, the JPA persistence context
# grows unbounded, and locks are held longer. A hundred is a common starting point for row-at-a-
# time JDBC work and is small enough that the restart demo has several committed chunks to resume
# from.
ecomdemo.batch.chunk-size=100

# How many bad rows the import tolerates before it gives up.
#
# A skip limit is a statement about data quality: "a few malformed rows in a supplier's file are
# normal, a file that is mostly malformed is a different file". Without a limit, a job would
# happily import 3 rows out of 10,000 and report success.
ecomdemo.batch.skip-limit=50

# When the daily sales report runs: 02:00 every day, in the JVM's zone. Six fields, not five -
# Spring's cron starts at SECONDS. Set to "-" to disable the schedule entirely.
ecomdemo.batch.sales-report-cron=0 0 2 * * *

# The import endpoint takes a file, and Spring Boot's default ceiling is 1MB per file - about
# 15,000 rows of this CSV. Raised so that "a 10,000-row import works" is not a claim that depends
# on how long the descriptions are. It is still a ceiling: an unbounded upload is a way to fill
# a disk from outside.
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB

# --- Actuator, metrics and probes (Phase 15) --------------------------------------------------
# Which endpoints are published over HTTP. An explicit allow-list, never `*`: the default set is
# "health only" precisely because exposing everything on a whim is how /actuator/env — which
# prints the environment, JWT_SECRET included — ends up reachable. Every name below is one that
# was deliberately wanted:
#   health      liveness and readiness for the container and, later, for Kubernetes
#   info        which build is actually running
#   metrics     the human-browsable view, one meter at a time (ADMIN only, see SecurityConfig)
#   prometheus  the machine-readable view Prometheus scrapes
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Turns on the two health GROUPS behind /actuator/health/liveness and /actuator/health/readiness.
# They are not the same question. LIVENESS asks "is this process broken beyond recovery?" — if it
# answers DOWN the right response is to kill and restart the container. READINESS asks "can this
# process serve traffic right now?" — if it answers DOWN the right response is to take it out of
# the load balancer and leave it alone, because it will very likely come back. Wiring a restart to
# the readiness answer is the classic outage amplifier: the database goes slow, every instance
# reports not-ready, the orchestrator restarts all of them at once, and now there is a thundering
# herd of cold JVMs on top of a slow database.
management.health.probes.enabled=true

# Readiness includes the things a request cannot be served without. `db` is the DataSource check;
# `readinessState` is Spring's own lifecycle flag, which is only ACCEPTING_TRAFFIC once the
# context has finished refreshing and goes back to REFUSING_TRAFFIC the moment a graceful
# shutdown begins.
#
# Redis is deliberately NOT here. The cache is an optimisation: if it is down every read still
# works, just slower, and taking the whole application out of rotation over it would turn a
# degradation into an outage. This one line is the difference.
management.endpoint.health.group.readiness.include=readinessState,db

# Liveness is the Spring lifecycle flag ALONE — no database, no Redis, no disk. A dependency has
# no business in a liveness probe: restarting this JVM cannot fix somebody else's database, and
# trying is how a dependency's bad ten minutes becomes an hour of restart loops.
management.endpoint.health.group.liveness.include=livenessState

# Detail in the health body is authorization-gated. Anonymous callers and the container's own
# HEALTHCHECK get a bare {"status":"UP"}; an authenticated ADMIN gets the per-component breakdown
# that is actually useful when it says DOWN. The component names alone ("redis", "db") map the
# infrastructure for anyone who asks.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# /actuator/info. `build` reads the build-info.properties the Maven plugin writes at package time;
# `java` and `os` report what the JVM is actually running on, which in a container is rarely what
# the person asking assumes. `env` stays off — it would publish every `info.*` property, and the
# habit of exposing environment-derived values from this endpoint is the same mistake as `*`.
management.info.build.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.env.enabled=false

# A tag added to EVERY meter in the registry. It costs nothing now, with one application, and is
# what makes a metric name unambiguous the moment there is a second one (Phase 17 onwards) — the
# difference between `http_server_requests_seconds_count` and having to guess whose it was. It is
# applied in MetricsConfig rather than here so the reasoning can live next to it.
ecomdemo.metrics.application=${spring.application.name}

# Publishes percentile HISTOGRAMS for the two timers worth asking latency questions about. This is
# not the same as `percentiles`: percentiles are computed inside this JVM and cannot be summed, so
# averaging the p95 of three instances produces a number that is not the p95 of anything. A
# histogram exports raw buckets, and Prometheus' histogram_quantile() computes the quantile across
# all of them correctly. Buckets cost one time series each, which is why this is an opt-in list
# and not a global switch.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.checkout.duration=true

# The SLO boundaries add explicit buckets at the latencies that are worth alerting on, so that
# "how many checkouts took longer than a second" is an exact count rather than an interpolation
# between whatever buckets happened to exist.
management.metrics.distribution.slo.checkout.duration=100ms,250ms,500ms,1s,2s,5s
