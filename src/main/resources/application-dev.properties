# --- dev profile: PostgreSQL on localhost -----------------------------------
# The default profile for running the application locally. Start the server first:
#
#   docker run --name ecomdemo-postgres -e POSTGRES_DB=ecomdemo -e POSTGRES_USER=ecomdemo \
#     -e POSTGRES_PASSWORD=ecomdemo -p 5432:5432 -d postgres:18-alpine
#
# Every value is read from an environment variable with a local default after the colon, so the
# same jar runs against a local container, a colleague's server or a managed instance with nothing
# but environment changes. The defaults are throwaway local credentials and are fine in Git; a
# real password is supplied as POSTGRES_PASSWORD and never written into a file.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ecomdemo}
spring.datasource.username=${POSTGRES_USER:ecomdemo}
spring.datasource.password=${POSTGRES_PASSWORD:ecomdemo}

# --- HikariCP ---------------------------------------------------------------
# Opening a PostgreSQL connection costs a TCP handshake, authentication and a backend process, so
# Hikari keeps a pool of open connections and hands them out. This was invisible with H2, where a
# "connection" was a method call inside the same JVM.
#
# maximum-pool-size is the ceiling on CONCURRENT database work: a request that needs a connection
# while all are busy waits, and after connection-timeout fails rather than hanging forever. Ten is
# generous for one developer machine and well under PostgreSQL's default limit of 100 backends.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# Recycle connections before PostgreSQL, a proxy or a cloud load balancer can drop them from the
# other end; a pooled connection that died while idle otherwise surfaces as a random query failure.
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Named so it is identifiable in logs, thread dumps and (from Phase 15) metrics.
spring.datasource.hikari.pool-name=EcomdemoPool

# --- Seed data --------------------------------------------------------------
# Nothing here any more. Until Phase 5 this profile ran data.sql on every start
# (spring.sql.init.mode=always) and the script had to guard itself against re-seeding. The
# catalogue now arrives as Flyway migration V2, which is applied exactly once and recorded.
