# --- it profile: real PostgreSQL in a Testcontainers container ---------------
# Activated by @ActiveProfiles("it") on com.ecomdemo.support.IntegrationTest, so it applies to
# every *IT test and to nothing else. The unit and slice tests keep the `test` profile and H2.
#
# The most important thing about this file is what is NOT in it: there is no
# spring.datasource.url, username or password. Those come from the container at runtime, read off
# it by @ServiceConnection (see PostgresContainerConfig). Writing a url here would override the
# container's own random port and the tests would connect to something else - most likely the
# developer's own database, which they would then quietly modify.
#
# Everything else - ddl-auto=validate, the Flyway settings, open-in-view=false - is inherited from
# application.properties, because that file applies to every profile. That is deliberate: the
# integration tests must run Flyway the way production does, against the engine production uses,
# on an empty database. It is the check that a migration which merely satisfied H2 actually works.

# A container-sized pool. The dev profile's ten connections exist for a running application; the
# integration tests are one JVM, and the only test that needs more than one connection at a time
# is the checkout race in OrderApiIT, which uses two.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.pool-name=EcomdemoItPool

# Flip to true when a test fails in a way that only the generated SQL explains - for instance to
# watch the versioned UPDATE that loses the checkout race.
spring.jpa.show-sql=false

# --- Caching (Phase 13) -----------------------------------------------------
# ON, against the real Redis container declared in RedisContainerConfig. As with the database,
# there is deliberately no spring.data.redis.host here: @ServiceConnection reads the host and the
# random port off the container itself, so these tests cannot accidentally talk to a Redis running
# on the developer's own machine.
spring.cache.type=redis

# The caches are shared state between tests in a class, in the same way the database is. Each test
# that cares clears what it needs rather than assuming an empty cache.
logging.level.com.ecomdemo.cache=DEBUG

# --- Spring Batch (Phase 14) -------------------------------------------------
# Under target/, so uploads, error files and reports written by the integration tests are thrown
# away by `mvn clean` and never appear in `git status`. The default (./batch) would write them
# into the working directory, which for a test run is the project root.
ecomdemo.batch.directory=./target/batch-it
