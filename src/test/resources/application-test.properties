# --- test profile: in-memory H2 ---------------------------------------------
# Activated for every test JVM by the surefire <systemPropertyVariables> in pom.xml, so
# `./mvnw clean verify` needs no database installed or running.
#
# This file lives in src/test/resources, not src/main/resources: it is test configuration and has
# no business being packaged into the jar. Note there is deliberately no application.properties
# beside it - a file of that name here would SHADOW the main one rather than add to it.
#
# MODE=PostgreSQL makes H2 parse PostgreSQL's dialect and behave like it in the places that most
# often differ. It narrows, but does not close, the gap that Phase 7 removes for good by running
# these tests against a real PostgreSQL in a container.
spring.datasource.url=jdbc:h2:mem:ecomdemo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# The suite runs the SAME Flyway migrations the application does, against H2, and then has
# Hibernate validate the result - exactly as in production. That makes `./mvnw clean verify` fail
# the moment a migration and the entities drift apart, instead of the application failing to start
# hours later. It is also why the migrations avoid PostgreSQL-only syntax for now.
#
# This is not the same as testing against PostgreSQL: H2 in PostgreSQL mode still parses and
# stores things its own way, and a migration it accepts can still fail on the real server. Phase 7
# closes that gap for good by running these tests against PostgreSQL in a container, and this
# whole file goes away with it.
spring.jpa.hibernate.ddl-auto=validate

# data.sql is gone; the catalogue the tests expect comes from migration V2.
