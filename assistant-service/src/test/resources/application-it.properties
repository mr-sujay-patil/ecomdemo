ecomdemo.jwt.secret=integration-test-signing-key-32-chars-minimum
ecomdemo.jwt.issuer=ecomdemo
ecomdemo.jwt.expiry=15m

# No real provider: the tests supply their own ChatModel and EmbeddingModel beans.
spring.ai.model.chat=none
spring.ai.model.embedding=none

# The hashing stand-in scores shared words, not meaning; its scale is lower than a real model's.
ecomdemo.assistant.retrieval.min-similarity=0.1
