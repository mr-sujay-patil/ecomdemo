spring.application.name=assistant-service
spring.config.import=classpath:ecomdemo-observability.properties

server.port=${ASSISTANT_PORT:8087}

# Verifies customers' tokens. It never issues one, and - unlike every other service - never mints a
# service token either: every call it makes downstream carries the customer's own.
ecomdemo.jwt.secret=${JWT_SECRET:}
ecomdemo.jwt.issuer=ecomdemo

# Conversation memory and proposed cart additions. The same Redis as the cache and the rate limiter,
# under the assistant:* prefix; both expire on their own.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
ecomdemo.metrics.application=assistant-service

# --- The models: the same switches as catalog-service (Phases 27 and 28) ---
# none (the default) leaves the service running and every chat a 503 with the setup steps. BOTH are
# needed: the chat model answers and calls the tools, the embedding model finds the policy passages.
spring.ai.model.chat=${AI_CHAT_PROVIDER:none}
spring.ai.model.embedding=${AI_EMBEDDING_PROVIDER:none}
spring.ai.model.embedding.text=none
spring.ai.model.embedding.multimodal=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${ASSISTANT_OPENAI_MODEL:gpt-4.1-mini}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
# Its own variable, not catalog's OLLAMA_MODEL: the assistant must call tools and follow rules about
# them, a much harder job for a small model than writing a description. MEASURED on the evaluation set
# (scripts/assistant-eval.py), same code and prompt, three runs each: qwen2.5:7b passed 11/11 every
# time; llama3.2 (3B) passed 8/11 every time - it printed a tool call as its answer instead of making
# it, and ignored what a tool told it. Hence qwen2.5:7b, which needs `ollama pull qwen2.5:7b` (4.7 GB).
spring.ai.ollama.chat.options.model=${ASSISTANT_OLLAMA_MODEL:qwen2.5:7b}

# Low: an assistant quoting prices and order states should say the same thing twice.
spring.ai.openai.chat.options.temperature=${ASSISTANT_TEMPERATURE:0.0}
spring.ai.ollama.chat.options.temperature=${ASSISTANT_TEMPERATURE:0.0}

# The deadline for ONE model call. An answer with tools makes two or three.
ecomdemo.ai.timeout=${AI_TIMEOUT:30s}
spring.ai.openai.chat.timeout=${ecomdemo.ai.timeout}
spring.ai.openai.chat.max-retries=1
spring.ai.openai.embedding.timeout=${ecomdemo.ai.timeout}
spring.ai.openai.embedding.max-retries=1
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s

# Embeddings: the same model and size as catalog-service's search.
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.openai.embedding.options.dimensions=768
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# --- Tool calling limits (Spring AI 2.0) ---
# Spring AI calls the model again after every round of tools, for as long as it keeps asking. A
# question needs one or two calls; five in total, and no tool more than three times, is a model
# going round in circles. Past that the answer is ended (THROW), not handed back to the model.
spring.ai.tools.limits.max-total-tool-calls=5
spring.ai.tools.limits.max-calls-per-tool-default=3
spring.ai.tools.limits.on-limit-exceeded=throw

# --- The assistant ---
ecomdemo.assistant.catalog-base-url=${CATALOG_BASE_URL:http://localhost:8081}
ecomdemo.assistant.app-base-url=${APP_BASE_URL:http://localhost:8084}
ecomdemo.assistant.connect-timeout=2s
ecomdemo.assistant.read-timeout=10s
ecomdemo.assistant.memory-messages=20
ecomdemo.assistant.memory-ttl=24h
ecomdemo.assistant.action-ttl=10m
ecomdemo.assistant.product-results=5

# Policy retrieval: per embedding model, like catalog's search. Overrides are blank = unset.
# nomic-embed-text, MEASURED on the evaluation set: every policy question scored its right passage
# 0.85-0.87, and no product, order, cart or off-topic question scored any passage above 0.68. 0.7
# sits in the gap, so a product question brings no policy text with it. (Catalog's search uses 0.5:
# a short query against short product texts scores lower overall than a question against a
# paragraph.) OpenAI's 0.3 is unmeasured, as in Phase 28.
ecomdemo.assistant.retrieval.provider=${spring.ai.model.embedding}
ecomdemo.assistant.retrieval.min-similarity=${POLICY_MIN_SIMILARITY:}
ecomdemo.assistant.retrieval.passages=3
ecomdemo.assistant.retrieval.models.ollama.min-similarity=0.7
ecomdemo.assistant.retrieval.models.ollama.document-prefix=search_document:
ecomdemo.assistant.retrieval.models.ollama.query-prefix=search_query:
ecomdemo.assistant.retrieval.models.openai.min-similarity=0.3
