# ---------------------------------------------------------------------------------------------
# payment-service (Phase 24): a MOCK payment provider, the saga's third step
# ---------------------------------------------------------------------------------------------
spring.application.name=payment-service
spring.config.import=classpath:ecomdemo-observability.properties

# Its own database, like every service since Phase 20: a payment is this service's fact alone.
spring.datasource.url=jdbc:postgresql://${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:5437}/${PAYMENT_DB_NAME:payment}
spring.datasource.username=${PAYMENT_DB_USER:payment}
spring.datasource.password=${PAYMENT_DB_PASSWORD:payment}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

server.port=${PAYMENT_PORT:8086}

ecomdemo.jwt.secret=${JWT_SECRET:}
ecomdemo.jwt.issuer=ecomdemo

# The mock's one rule: decline any order whose total is ABOVE this. See PaymentProperties.
ecomdemo.payment.decline-above=${PAYMENT_DECLINE_ABOVE:10000.00}

# ---------------------------------------------------------------------------------------------
# Kafka: reads inventory.stock-reserved; publishes payments.completed / payments.failed through
# the outbox. Consumer settings as inventory-service's (ErrorHandlingDeserializer, record acks, no
# default type - the listener names its own).
# ---------------------------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecomdemo.*
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# The producer the outbox relay copies its settings from (it swaps in a String serializer).
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=3000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
ecomdemo.metrics.application=payment-service
