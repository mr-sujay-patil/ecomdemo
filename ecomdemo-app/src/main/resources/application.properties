spring.application.name=ecomdemo

# --- Profiles ---------------------------------------------------------------
# Everything in THIS file applies to every profile. Anything that differs between running the
# application and running the test suite lives in application-<profile>.properties, and a profile
# file wins over this one.
#
#   dev   -> PostgreSQL on localhost (see the README for the docker run command)
#   test  -> in-memory H2, activated by the surefire configuration in pom.xml
#
# `dev` is the default so that `./mvnw spring-boot:run` works with no extra arguments. Override it
# from outside with SPRING_PROFILES_ACTIVE=... or --spring.profiles.active=...
spring.profiles.active=dev

# --- JPA / Hibernate -------------------------------------------------------
# `validate` means: on startup, compare the entities against the schema that is already there and
# fail fast if they disagree. Hibernate no longer creates or alters anything - Flyway does.
#
# The previous value, `update`, is the one to be afraid of in production. It looks at the
# entities, guesses the ALTER statements needed to close the gap, and runs them unreviewed on
# whatever database it is pointed at. It only ever adds, never removes, so a renamed field
# silently leaves the old column behind holding the real data; it has no idea how to move data;
# it runs a different set of statements on every environment depending on that environment's
# current state; and nothing is recorded, so nobody can say what it did or undo it. `validate`
# turns that guesswork into a check, and the ALTERs become reviewed files in Git.
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway ----------------------------------------------------------------
# Enabled by the starter as soon as flyway-core is on the classpath; the location below is also
# the default. It is written out because it is a contract: `V<version>__<description>.sql` files
# in src/main/resources/db/migration, applied in version order, each recorded once in
# `flyway_schema_history` with a checksum of its contents.
spring.flyway.locations=classpath:db/migration

# Fail rather than guess if Flyway ever meets a database that already has tables but no history
# table (an old ddl-auto=update database, for instance). Turning this on would make Flyway write
# a baseline row and skip straight to the newest migration, leaving a schema nobody verified.
spring.flyway.baseline-on-migrate=false

# Refuse to start when a migration already applied has been edited since (its checksum no longer
# matches) or has disappeared. This is the check that enforces "never edit an applied migration".
spring.flyway.validate-on-migrate=true

# Open Session In View is ON by default: it holds the Hibernate session open for the whole
# HTTP request, so a lazy association touched during JSON serialisation quietly triggers another
# query instead of failing. That hides N+1 problems and makes the web layer behave differently
# from tests. Turning it off means the repositories must fetch everything the caller needs -
# which is what the JOIN FETCH queries in CartRepository and OrderRepository do.
spring.jpa.open-in-view=false

# Set to true to watch the SQL Hibernate generates - useful for seeing the JOIN
# FETCH queries and the N+1 problem they avoid.
spring.jpa.show-sql=false

# --- OpenAPI / Swagger UI --------------------------------------------------
# Both paths are springdoc's defaults; they are written out here so the contract is visible in
# config rather than only in the library, and so a later phase that moves them behind a gateway
# has one obvious place to change.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Show the endpoints grouped by @Tag in the order the tags are declared, and the operations
# within a tag by HTTP method, instead of springdoc's non-deterministic scan order.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Swagger UI's "Try it out" is the whole point of shipping the UI in a learning project, so it
# stays on. Phase 8 (Spring Security) is where access to these paths gets decided.
springdoc.swagger-ui.try-it-out-enabled=true

# --- JWT (Phase 9) ---------------------------------------------------------
# The HMAC signing key. It comes from the environment and has NO default in this file on purpose:
# a signing key committed to Git is a signing key everyone has, and anybody holding it can mint a
# token for any account with any role. When the variable is unset the application generates a
# random key at startup and warns that tokens will not survive a restart - see JwtConfig.
#
#   JWT_SECRET='at-least-32-characters-of-random-text' ./mvnw spring-boot:run
ecomdemo.jwt.secret=${JWT_SECRET:}

# Written into `iss` and required back on the way in, so a token minted by another system is
# rejected here even if it were signed with the same key.
ecomdemo.jwt.issuer=ecomdemo

# Short, because a JWT cannot be withdrawn. Nothing consults the database once a token is issued,
# so a role taken away - or an account deleted - stays effective until this elapses. Fifteen
# minutes keeps that window small; a refresh token is what makes a short expiry comfortable for
# users, and this phase deliberately does not add one.
ecomdemo.jwt.expiry=15m

# --- Spring Batch (Phase 14) ------------------------------------------------
# OFF. Spring Boot's JobLauncherApplicationRunner runs EVERY Job bean it can find once the
# context is up, which is right for a batch application launched from the command line and wrong
# for a web application that happens to contain jobs: a restart would re-import whatever file the
# last upload left on disk, and the sales report would run at boot rather than at 02:00.
#
# The jobs here have their own triggers - an ADMIN upload endpoint for the import, a cron for the
# report - so nothing should start one just because the application did.
spring.batch.job.enabled=false

# Where the jobs read and write files.
#
# One directory tree, under a base that defaults to ./batch and is overridden in the container
# (see compose.yaml, which mounts a volume there). Uploads are staged rather than streamed
# straight into the job, because a restart re-reads the SAME file by path: a job whose input
# lived only in the request body could never be restarted at all.
ecomdemo.batch.directory=${BATCH_DIR:./batch}

# Chunk size: how many rows are read and processed before ONE transaction commits them.
#
# This is the knob the whole framework turns on. Too small and the job pays a commit per handful
# of rows; too large and a single failure rolls back a lot of work, the JPA persistence context
# grows unbounded, and locks are held longer. A hundred is a common starting point for row-at-a-
# time JDBC work and is small enough that the restart demo has several committed chunks to resume
# from.
ecomdemo.batch.chunk-size=100

# How many bad rows the import tolerates before it gives up.
#
# A skip limit is a statement about data quality: "a few malformed rows in a supplier's file are
# normal, a file that is mostly malformed is a different file". Without a limit, a job would
# happily import 3 rows out of 10,000 and report success.
ecomdemo.batch.skip-limit=50

# When the daily sales report runs: 02:00 every day, in the JVM's zone. Six fields, not five -
# Spring's cron starts at SECONDS. Set to "-" to disable the schedule entirely.
ecomdemo.batch.sales-report-cron=0 0 2 * * *

# The import endpoint takes a file, and Spring Boot's default ceiling is 1MB per file - about
# 15,000 rows of this CSV. Raised so that "a 10,000-row import works" is not a claim that depends
# on how long the descriptions are. It is still a ceiling: an unbounded upload is a way to fill
# a disk from outside.
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB

# --- Actuator, metrics and probes (Phase 15) --------------------------------------------------
# Which endpoints are published over HTTP. An explicit allow-list, never `*`: the default set is
# "health only" precisely because exposing everything on a whim is how /actuator/env — which
# prints the environment, JWT_SECRET included — ends up reachable. Every name below is one that
# was deliberately wanted:
#   health      liveness and readiness for the container and, later, for Kubernetes
#   info        which build is actually running
#   metrics     the human-browsable view, one meter at a time (ADMIN only, see SecurityConfig)
#   prometheus  the machine-readable view Prometheus scrapes
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Turns on the two health GROUPS behind /actuator/health/liveness and /actuator/health/readiness.
# They are not the same question. LIVENESS asks "is this process broken beyond recovery?" — if it
# answers DOWN the right response is to kill and restart the container. READINESS asks "can this
# process serve traffic right now?" — if it answers DOWN the right response is to take it out of
# the load balancer and leave it alone, because it will very likely come back. Wiring a restart to
# the readiness answer is the classic outage amplifier: the database goes slow, every instance
# reports not-ready, the orchestrator restarts all of them at once, and now there is a thundering
# herd of cold JVMs on top of a slow database.
management.health.probes.enabled=true

# Readiness includes the things a request cannot be served without. `db` is the DataSource check;
# `readinessState` is Spring's own lifecycle flag, which is only ACCEPTING_TRAFFIC once the
# context has finished refreshing and goes back to REFUSING_TRAFFIC the moment a graceful
# shutdown begins.
#
# Redis is deliberately NOT here. The cache is an optimisation: if it is down every read still
# works, just slower, and taking the whole application out of rotation over it would turn a
# degradation into an outage. This one line is the difference.
management.endpoint.health.group.readiness.include=readinessState,db

# Liveness is the Spring lifecycle flag ALONE — no database, no Redis, no disk. A dependency has
# no business in a liveness probe: restarting this JVM cannot fix somebody else's database, and
# trying is how a dependency's bad ten minutes becomes an hour of restart loops.
management.endpoint.health.group.liveness.include=livenessState

# Detail in the health body is authorization-gated. Anonymous callers and the container's own
# HEALTHCHECK get a bare {"status":"UP"}; an authenticated ADMIN gets the per-component breakdown
# that is actually useful when it says DOWN. The component names alone ("redis", "db") map the
# infrastructure for anyone who asks.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# /actuator/info. `build` reads the build-info.properties the Maven plugin writes at package time;
# `java` and `os` report what the JVM is actually running on, which in a container is rarely what
# the person asking assumes. `env` stays off — it would publish every `info.*` property, and the
# habit of exposing environment-derived values from this endpoint is the same mistake as `*`.
management.info.build.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.env.enabled=false

# A tag added to EVERY meter in the registry. It costs nothing now, with one application, and is
# what makes a metric name unambiguous the moment there is a second one (Phase 17 onwards) — the
# difference between `http_server_requests_seconds_count` and having to guess whose it was. It is
# applied in MetricsConfig rather than here so the reasoning can live next to it.
ecomdemo.metrics.application=${spring.application.name}

# Publishes percentile HISTOGRAMS for the two timers worth asking latency questions about. This is
# not the same as `percentiles`: percentiles are computed inside this JVM and cannot be summed, so
# averaging the p95 of three instances produces a number that is not the p95 of anything. A
# histogram exports raw buckets, and Prometheus' histogram_quantile() computes the quantile across
# all of them correctly. Buckets cost one time series each, which is why this is an opt-in list
# and not a global switch.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.checkout.duration=true

# The SLO boundaries add explicit buckets at the latencies that are worth alerting on, so that
# "how many checkouts took longer than a second" is an exact count rather than an interpolation
# between whatever buckets happened to exist.
management.metrics.distribution.slo.checkout.duration=100ms,250ms,500ms,1s,2s,5s

# --- Structured logging (Phase 16) ------------------------------------------------------------
# Turns the console log from lines meant for a human into JSON meant for a machine. Spring Boot
# does this natively since 3.4 — there is no logback-logstash-encoder dependency and no
# hand-written logback-spring.xml, because both were the old answer to a problem the framework
# now solves with one property.
#
# WHY IT MATTERS: a log line like
#     2026-09-22 16:07:30.240 INFO 1 --- [http-nio-8080-exec-2] c.e.l.RequestLogFilter : POST /api/orders -> 201 in 43ms
# is perfectly readable and almost useless to a machine. Finding "every 5xx for this customer in
# the last hour" in it means a regular expression per log format, re-written whenever someone
# changes a pattern. The same event as JSON carries the level, the logger, the thread and every
# MDC field as NAMED values, so the same question is a field comparison that keeps working when
# the message text changes.
#
# EMPTY MEANS PLAIN TEXT. The format is a deployment decision, not a code one: on a laptop
# `./mvnw spring-boot:run` should stay readable, and in a container the log is going to Alloy and
# Loki, not to a person. So the value comes from an environment variable that is unset locally
# and set to `ecs` by compose. Spring Boot treats an empty value as "not structured" and uses the
# usual pattern layout.
logging.structured.format.console=${LOG_FORMAT:}

# WHICH JSON. `ecs` is the Elastic Common Schema: a published field vocabulary where a log level
# is always `log.level`, an error is always `error.type` / `error.message` / `error.stack_trace`,
# and the service is always `service.name`. The alternatives Boot ships are `logstash` and `gelf`,
# each tied to the tool it is named after. A schema someone else maintains beats a private one for
# exactly the reason a metric name does: it is the interface the dashboards and queries are
# written against, and here it is also the thing that would have to change if this application
# ever ships its logs somewhere other than Loki.
#
# The service fields below are what make one JSON document self-describing once several
# applications write into the same Loki. name and version default from spring.application.name
# and spring.application.version; the version is written explicitly because the build plugin
# resolves it, and `environment` has no default at all.
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=@project.version@
logging.structured.ecs.service.environment=${spring.profiles.active}

# Which instance wrote the line. In a container HOSTNAME is the container ID, which is exactly
# the granularity wanted the first time two replicas disagree about something; on a laptop the
# variable is the machine name. It is empty in neither case, and an empty value is simply omitted
# from the JSON.
logging.structured.ecs.service.node-name=${HOSTNAME:}

# --- Apache Kafka (Phase 17) --------------------------------------------------------------------
# Where the broker is. `localhost:29092` is the HOST listener published by compose, which is what
# `./mvnw spring-boot:run` on a laptop needs; the container overrides this to `kafka:9092` (the
# INTERNAL listener) through SPRING_KAFKA_BOOTSTRAP_SERVERS. Two addresses for one broker is not a
# quirk of this setup - it is what "advertised listeners" exist for, and compose.yaml explains why.
#
# "Bootstrap" is literal: the client connects here ONCE to ask which broker leads which partition,
# then talks to those brokers directly. With one broker the distinction is invisible; with three it
# is the difference between a working client and one that can only reach a third of the data.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# --- Producer -----------------------------------------------------------------------------------
# The key is the order id as a string; the value is JSON.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# acks=all: the leader answers only once every in-sync replica has the record. `1` would
# acknowledge as soon as the LEADER has it, which loses the record if that broker dies before the
# followers catch up, and `0` does not wait at all. With one broker every setting behaves the same
# - which is exactly why it is worth writing the right one down now rather than discovering the
# difference on a cluster.
spring.kafka.producer.acks=all

# Retry a failed send, and do it WITHOUT creating duplicates. Without idempotence, a send that
# succeeded but whose acknowledgement was lost is retried and written twice; with it, the producer
# stamps each record with a sequence number the broker uses to recognise the repeat. This is the
# only "exactly once" Kafka can give on its own, and note what it covers: broker-side duplicates
# from producer retries, and nothing at all about the consumer.
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.retries=3

# Do not include Java type information in the message headers. The default writes the producer's
# fully-qualified class name into a header and the consumer instantiates THAT - which couples every
# consumer to this application's package structure and breaks the moment a class is moved. The
# consumer below is told what type to expect instead, which is a decision it owns.
spring.kafka.producer.properties.spring.json.add.type.headers=false

# --- Consumer -----------------------------------------------------------------------------------
spring.kafka.consumer.group-id=ecomdemo-notification
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ErrorHandlingDeserializer WRAPS the JSON one. Without it, a malformed message is a poison pill:
# deserialization happens before any of the application's code runs, so there is nothing to catch
# the exception, the record is never processed, the offset is never committed, and the consumer
# re-reads the same bad bytes for ever. The wrapper catches it and hands the listener container a
# failure it can route to the DLT - which is what makes the poison-message test pass rather than
# hang.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecomdemo.messaging.OrderPlacedEvent

# Deserializing JSON into a type named by the MESSAGE is remote code instantiation with extra
# steps, so the allow-list exists and must stay narrow. It is this application's own packages and
# nothing else.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecomdemo.*

# `earliest`: a brand-new consumer group reads the topic from the beginning. `latest` - the Kafka
# default - would silently skip everything published before the consumer first started, which on a
# fresh `docker compose up` means the first orders produce no notifications and nothing explains
# why. This only applies when the group has no committed offset; an existing group always resumes
# from where it left off.
spring.kafka.consumer.auto-offset-reset=earliest

# Spring commits the offset after the listener returns successfully, rather than the client
# committing on a timer in the background. Auto-commit would acknowledge records the listener had
# not finished with - so a crash mid-notification would lose them, which is the opposite failure to
# the duplicate one and much harder to notice.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# One consumer thread per partition (there are three). More would sit idle: a partition is assigned
# to at most one consumer in a group, which is the ceiling on parallelism and the reason partition
# count is a capacity decision made when the topic is created.
spring.kafka.listener.concurrency=3

# How long `KafkaTemplate.send` may block waiting for cluster metadata before giving up. The
# default is SIXTY SECONDS, and the default is what made a checkout take 97 seconds with the broker
# stopped: `send` returns a future, but it blocks inside the call until it knows which broker leads
# the partition. Five seconds is long enough to ride out a leader election and short enough that a
# thread is never parked on a broker that is simply not there.
#
# Phase 18 changed who this protects. The publisher pool it was paired with is gone - sending is
# now the outbox relay's job, on a scheduler thread that nobody is waiting for - so this no longer
# stands between a broker outage and a customer's checkout. It stands between a broker outage and
# a relay tick: without it a dead broker would park the relay for a minute per attempt, which is a
# minute of a database transaction held open for nothing.
spring.kafka.producer.properties.max.block.ms=5000

# The total time a record may spend being retried before the send is failed. It must be at least
# `linger.ms + request.timeout.ms`; ten seconds keeps a genuine outage from being reported as an
# error a minute after the order it belongs to.
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=3000

# ==========================================================================================
# Transactional outbox (Phase 18)
# ==========================================================================================
# The event is written to `outbox_event` in the order's own transaction, and a scheduled relay
# publishes it to Kafka afterwards. These four settings are the pace of that relay. They are
# spelled out here, rather than left to OutboxProperties' defaults, because @Scheduled resolves
# its placeholders from the Environment and not from the bound record - a missing property here
# would fail the context at startup, not silently fall back.

# How long the relay waits after finishing one batch before starting the next. `fixedDelay`, so a
# slow tick against a struggling broker pushes the next one out rather than piling up behind it.
# One second is the outbox's latency floor for the ordinary case: below what anyone waiting for a
# notification would notice, and an indexed empty-set query the rest of the time.
ecomdemo.outbox.poll-delay=1s

# Events published per tick, which is also the recovery rate: 100 per second here. Bounded because
# a batch is one transaction, and draining a large backlog in a single transaction would hold locks
# for as long as it took. Each batch commits on its own, so recovery is incremental.
ecomdemo.outbox.batch-size=100

# How long a PUBLISHED event is kept before the cleanup job sweeps it. Forensics, not correctness -
# nothing re-reads a published row - so a week is an opinion rather than a proof. Pending rows are
# never swept at any age, which is enforced in the repository's delete query.
ecomdemo.outbox.retention=7d

# When that sweep runs: 03:00, an hour after the sales report, so the two never contend. Six
# fields - Spring's cron starts at SECONDS. Set to "-" to disable it entirely.
ecomdemo.outbox.cleanup-cron=0 0 3 * * *

# ==========================================================================================
# Where the services are (Phase 20b)
# ==========================================================================================
# One address per extracted service, configurable, with a localhost default so that running both
# from an IDE works with no configuration. Compose overrides it with the service name on its
# network.
#
# This is deliberately NOT service discovery. A registry, client-side load balancing and health-
# aware routing are the grown-up version and are a phase of their own; a hard-coded configurable
# address is the honest starting point, and it becomes visibly inadequate the day there is more
# than one instance of anything - which is exactly when it should.
ecomdemo.inventory.base-url=${INVENTORY_BASE_URL:http://localhost:8082}

# catalog-service, which owns the product catalogue since Phase 20c. The application keeps the
# PUBLIC /api/products and forwards to it, so the split stays invisible to shoppers and that service
# can require a service token on every path of its own.
ecomdemo.catalog.base-url=${CATALOG_BASE_URL:http://localhost:8081}
